<style>
:root{--ink:#0b0709;--paper:#f6ecdf;--silver:#a59c95;--gold:#e6c27a;--her:#efb8b1;--him:#f3e3c3;--line:#3a2530;--display:"Cormorant Garamond",Georgia,serif;--body:"Jost","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse 90% 45% at 50% -8%,rgba(239,184,177,.16),transparent 70%),radial-gradient(ellipse 80% 40% at 50% 108%,rgba(230,194,122,.12),transparent 70%),#0b0709 fixed;color:var(--paper);font-family:var(--body);font-weight:300;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding:14px 14px 24px;display:flex;flex-direction:column;gap:12px}
.caps{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);text-align:center}
h1{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(38px,11vw,52px);margin:6px 0 0;text-align:center;line-height:1;text-shadow:0 0 30px rgba(239,184,177,.35)}
p.sub{color:var(--silver);text-align:center;font-size:15px;line-height:1.5;margin:0 auto;max-width:32ch}
.btn{font:inherit;font-size:16px;padding:14px 18px;border-radius:999px;border:0;cursor:pointer;width:100%;color:#1a0f14;transition:transform .12s}.btn:active{transform:scale(.97)}
.btn.her{background:linear-gradient(135deg,#f7cdc7,#e79c94)}.btn.him{background:linear-gradient(135deg,#faf0dc,#e2c99a)}
.screen[hidden]{display:none!important}.screen{display:flex;flex-direction:column;gap:12px}
.top{display:flex;gap:12px;align-items:center}
.mini{flex:0 0 auto;display:flex;border:1px solid rgba(230,194,122,.35);border-radius:8px;overflow:hidden;background:#140c11}
.mini canvas{display:block;width:52px;height:72px;image-rendering:pixelated}
.stat{flex:1;font-size:13px;color:var(--silver);line-height:1.5}.stat b{color:var(--paper);font-weight:400}
.bar{height:5px;border-radius:3px;background:#2a1a22;overflow:hidden;margin:3px 0 6px}.bar i{display:block;height:100%;width:0;transition:width .4s}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#5a4a50;margin-right:6px;vertical-align:1px}.dot.on{background:#8fd19e;box-shadow:0 0 8px #8fd19e}
.board{position:relative;border:1px solid rgba(230,194,122,.3);border-radius:12px;overflow:hidden;box-shadow:0 0 0 4px #0b0709,0 0 0 5px rgba(230,194,122,.12),0 18px 50px rgba(0,0,0,.6);touch-action:none;background:#140c11}
.board canvas{display:block;width:100%}
.pal{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.pal button{position:relative;aspect-ratio:1;border-radius:12px;border:2px solid transparent;cursor:pointer;font:500 15px var(--body);padding:0;transition:transform .12s}
.pal button.sel{border-color:#fff;transform:translateY(-4px) scale(1.06);box-shadow:0 6px 16px rgba(0,0,0,.5)}
.pal button.done{opacity:.28}.pal button small{position:absolute;right:3px;bottom:1px;font-size:8px;opacity:.75}
.tip{text-align:center;font-size:13.5px;color:var(--silver);min-height:2.8em;line-height:1.45;margin:0}.tip b{color:var(--paper);font-weight:400}
#reveal{position:fixed;inset:0;z-index:20;background:rgba(11,7,9,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;opacity:0;pointer-events:none;transition:opacity .8s}
#reveal.show{opacity:1;pointer-events:auto}
.join{display:flex;width:min(92vw,440px);border:1px solid var(--gold);border-radius:12px;overflow:hidden;box-shadow:0 0 60px rgba(230,194,122,.3)}
.half{position:relative;flex:1;aspect-ratio:26/36;transform:translateX(var(--o));transition:transform 1.8s cubic-bezier(.2,.8,.2,1)}
.half canvas,.half img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}.half img{image-rendering:auto;opacity:0;transition:opacity 2.2s 2s;object-fit:cover}
#reveal .half.l{--o:-30%}#reveal .half.r{--o:30%}#reveal.show .half.l,#reveal.show .half.r{--o:0%}#reveal.show .half img{opacity:1}
#reveal q{font-family:var(--display);font-style:italic;font-size:clamp(22px,6.4vw,30px);text-align:center;line-height:1.25;quotes:none;max-width:22ch}
#reveal button{font:inherit;background:none;border:1px solid var(--line);color:var(--silver);border-radius:999px;padding:8px 18px}

 <div class="caps" style="margin-top:22px">Two Halves</div><h1>Paint me</h1>
 <p class="sub">One picture, split in two. You each colour in the other half, from wherever you are. It only becomes whole when you’ve both finished.</p>

const ROOM='twohalves-paint-sm-2309';let conn=null,peer=null,bc=null,online=false,outQ={her:[],him:[]};
function setOnline(v){online=v;$('dot').classList.toggle('on',v);ui()}

function onMsg(o){if(!o)return;if(o.t==='hi'||o.t==='state'){['her','him'].forEach(h=>{const a=un64(o[h]);for(let i=0;i<N;i++)fill[h][i]|=a[i]});if(o.t==='hi')send({t:'state',her:b64(fill.her),him:b64(fill.him)});setOnline(true);save();draw();ui();check()}

  $('themLbl').textContent=NAME[me==='her'?'him':'her']+', painting you';$('themPct').textContent=Math.round(tp*100)+'%'+(online?' · here now':'');$('themBar').style.width=tp*100+'%';$('themBar').style.background=them==='her'?'var(--her)':'var(--him)';
  const P=D[mine].pal;[...$('pal').children].forEach((b,k)=>{let left=0;for(let i=0;i<N;i++)if(num(mine,i)===k+1&&!fill[mine][i])left++;b.classList.toggle('sel',sel===k+1);b.classList.toggle('done',!left);b.querySelector('small').textContent=left||'✓'})}
function buildPal(){const P=D[mine].pal,el=$('pal');el.innerHTML='';P.forEach((c,k)=>{const b=document.createElement('button');b.style.background=c;b.style.color=k>4?'#1a0f14':'#f6ecdf';b.innerHTML=(k+1)+'<small></small>';b.onclick=()=>{sel=k+1;draw();ui()};el.appendChild(b)})}
let down=false,last=0;
function at(e){const r=cv.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/CS),y=Math.floor((e.clientY-r.top)/CS);if(x<0||y<0||x>=W||y>=H)return;const i=y*W+x;if(fill[mine][i])return;
  if(num(mine,i)===sel){fill[mine][i]=1;outQ[mine].push(i);if(navigator.vibrate&&Date.now()-last>60){navigator.vibrate(4);last=Date.now()}draw();ui();save();check()}
  else if(e.type==='pointerdown'){tip(`That one is a <b>${num(mine,i)}</b>. Pick colour ${num(mine,i)} below.`)}}
cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);at(e)});cv.addEventListener('pointermove',e=>{if(down)at(e)});['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>down=false));
let shown=false;function check(){if(!me)return;const a=pct(mine),them=mine==='her'?'him':'her',b=pct(them);
  if(a>=1&&b>=1){if(!shown){shown=true;paintMini($('rL'),'her');paintMini($('rR'),'him');$('pL').src=D.her.photo;$('pR').src=D.him.photo;setTimeout(()=>$('reveal').classList.add('show'),600)}}
  else if(a>=1)tip('<b>Your half is done.</b> The picture becomes whole when your other half finishes theirs.');
  else tip(online?'<b>They’re here too.</b> Watch their half fill in up top while you paint.':'Pick a colour, then drag over the squares with that number. Your progress saves by itself.')}
$('rClose').onclick=()=>$('reveal').classList.remove('show');
function start(r){me=r;mine=PAINTS[r];save();$('who').hidden=true;$('main').hidden=false;buildPal();for(let k=1;k<=K;k++){let left=0;for(let i=0;i<N;i++)if(num(mine,i)===k&&!fill[mine][i])left++;if(left){sel=k;break}}size();ui();check();net()}
$('iHer').onclick=()=>start('her');$('iHim').onclick=()=>start('him');addEventListener('resize',()=>{if(me)size()});
load();if(me)start(me);
</script></body></html>
