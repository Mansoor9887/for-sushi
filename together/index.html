<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0b0b">
<meta name="robots" content="noindex">
<title>Two Halves: Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
/* Board first, quick replies right under it, controls at thumb height, full chat in a sheet. Same blush/cream/dark world as Two Halves. */
:root{--ink:#0d0b0b;--panel:#151212;--panel2:#1d1817;--line:#2b2624;--paper:#f1e9e0;--silver:#a59c95;--blush:#efb8b1;--rose:#d9837c;--cream:#f3e3c3;
 --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;--body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;color-scheme:dark}
html,body{background:var(--ink);color:var(--paper);min-height:100%}
body{font-family:var(--body);font-weight:300;padding-block:10px 18px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
h1{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(38px,11vw,52px);margin:18px 0 0;line-height:1;text-align:center}
.sub{color:var(--silver);text-align:center;font-size:14px;margin:0;line-height:1.5}
.btn{font:inherit;font-size:16px;padding:14px 18px;border-radius:999px;border:1px solid var(--paper);background:var(--paper);color:var(--ink);cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--paper);border-color:var(--line)}
.btn.her{background:var(--blush);border-color:var(--blush)}.btn.him{background:var(--cream);border-color:var(--cream)}
button:focus-visible,input:focus-visible{outline:2px solid var(--blush);outline-offset:2px}
.row{display:flex;gap:10px}.row>*{flex:1}
input.code{font:inherit;font-size:28px;letter-spacing:.4em;text-align:center;text-transform:uppercase;background:var(--panel);color:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;width:100%}
.codebig{font-family:var(--display);font-size:56px;letter-spacing:.25em;text-align:center;margin:4px 0;color:var(--blush)}
.screen[hidden]{display:none!important}.screen{display:flex;flex-direction:column;gap:10px}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--silver)}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .4s}.dots i.on{background:var(--blush)}
.boardwrap{position:relative;height:min(54vh,calc((100vw - 24px)*13/9),640px);aspect-ratio:9/13;max-width:100%;margin:0 auto;background:#0a0808;border-radius:14px;overflow:hidden;touch-action:none;box-shadow:0 10px 40px rgba(0,0,0,.5)}
canvas{width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;background:rgba(10,8,8,.84);padding:0 22px;opacity:0;pointer-events:none;transition:opacity .45s}
.overlay.show{opacity:1;pointer-events:auto}
.overlay .n{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--silver)}
.overlay .t{font-family:var(--display);font-style:italic;font-size:clamp(30px,9vw,42px);line-height:1.05;white-space:pre-line}
.overlay .s{font-size:15px;color:var(--silver);line-height:1.5;max-width:30ch}
.tip{min-height:2.6em;text-align:center;font-size:13.5px;line-height:1.45;color:var(--silver);margin:0}.tip b{color:var(--paper);font-weight:400}
.quick{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.quick::-webkit-scrollbar{display:none}
.quick button{flex:0 0 auto;font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--paper);cursor:pointer;white-space:nowrap}
.quick .open{border-color:var(--blush);color:var(--blush);position:relative}
.quick .open .badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--rose);color:var(--ink);font-size:10px;display:grid;place-items:center;padding:0 4px}
.controls{display:flex;gap:12px;justify-content:center;align-items:center}
.pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:6px}
.pad.small{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px)}
.pad button{font:inherit;font-size:18px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--paper);cursor:pointer;touch-action:none;transition:transform .08s,background .08s}
.pad button.down{background:var(--panel2);transform:scale(.94)}
.pad .lbl{display:grid;place-items:center;font-size:9px;letter-spacing:.2em;color:var(--silver)}
.pad .pow{font-size:10px;letter-spacing:.12em;font-weight:500;border-color:var(--blush);color:var(--blush);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1}.pad .pow b{font-size:18px;font-weight:400}
.pad.him .pow,.pow.him{border-color:var(--cream);color:var(--cream)}
.big{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.big button{min-width:150px;height:96px;border-radius:24px;font:inherit;font-size:20px;border:2px solid var(--blush);background:#1d1615;color:var(--blush);cursor:pointer;touch-action:none;transition:transform .06s}.big button.him{border-color:var(--cream);color:var(--cream)}.big button.down{transform:scale(.95);background:#2a201f}
.bossctl{display:flex;gap:10px;justify-content:center;align-items:center}.bossctl button{width:74px;height:74px;border-radius:20px;font:inherit;font-size:22px;border:1px solid var(--line);background:var(--panel);color:var(--paper);cursor:pointer;touch-action:none}.bossctl button.down{background:var(--panel2)}.bossctl .act{width:110px;border-color:var(--blush);color:var(--blush);font-size:14px;letter-spacing:.1em}.bossctl .act.him{border-color:var(--cream);color:var(--cream)}
.bossctl.small button{width:52px;height:56px;font-size:16px}.bossctl.small .act{width:70px;font-size:11px}
.pad.her button{border-color:#5a3f3c}.pad.him button{border-color:#5a5141}
.keys{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.keys button{height:62px;border-radius:16px;font-size:28px;border:1px solid var(--line);background:var(--panel);color:var(--paper);cursor:pointer;touch-action:none;transition:transform .08s}
.keys button:active{transform:scale(.93)}
.keys .note{grid-column:1/-1;text-align:center;color:var(--silver);font-size:13px}
.status{font-size:12px;color:var(--silver);text-align:center}
/* chat sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:70vh;background:#120f0f;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.open{transform:none}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:12px max(16px,env(safe-area-inset-left,0px)) 8px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--silver)}
.sheet header button{background:none;border:0;color:var(--paper);font-size:22px;cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:4px 16px 10px;display:flex;flex-direction:column;gap:6px;min-height:160px}
.msg{max-width:78%;padding:8px 12px;border-radius:16px;font-size:15px;line-height:1.35;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--blush);color:var(--ink);border-bottom-right-radius:4px}
.msg.them{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:4px}
.msg.him.me{background:var(--cream)}
.sheet form{display:flex;gap:8px;padding:8px 16px 12px}
.sheet input{flex:1;font:inherit;font-size:16px;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--paper)}
.sheet form button{font:inherit;padding:0 18px;border-radius:999px;border:0;background:var(--blush);color:var(--ink);cursor:pointer}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .3s;z-index:19}.scrim.open{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.overlay,.sheet{transition:none}}
</style>
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>


<div class="wrap">
  <section class="screen" id="home">
    <h1>Two Halves</h1>
    <p class="sub">Chapter 1 · Two Cities. New powers in every stage, a boss, and mini-games. Use the chat to work together.</p>
    <button class="btn" id="bCreate">Create a room</button>
    <button class="btn ghost" id="bJoin">Join a room</button>
    <button class="btn ghost" id="bLocal">Play on one phone</button>
  </section>

  <section class="screen" id="create" hidden>
    <p class="sub">Who are you playing as?</p>
    <div class="row"><button class="btn her" id="asHer">Her</button><button class="btn him" id="asHim">Him</button></div>
    <div id="codebox" hidden>
      <p class="sub">Send this code to your other half</p>
      <div class="codebig" id="codeShow">····</div>
      <p class="status" id="cStatus">Waiting for them to join…</p>
    </div>
    <button class="btn ghost" data-back>Back</button>
  </section>

  <section class="screen" id="join" hidden>
    <p class="sub">Type the code from your other half</p>
    <input class="code" id="codeIn" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Room code">
    <button class="btn" id="bGo">Join</button>
    <p class="status" id="jStatus"></p>
    <button class="btn ghost" data-back>Back</button>
  </section>

  <section class="screen" id="game" hidden>
    <div class="hud"><span id="who"></span><div class="dots" id="dots"></div><span id="net"></span></div>
    <div class="boardwrap" id="bw">
      <canvas id="cv" width="540" height="780"></canvas>
      <button id="skip" hidden style="position:absolute;top:12px;right:12px;z-index:5;font:inherit;font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:rgba(0,0,0,.5);color:#f1e9e0;border:1px solid #2b2624;border-radius:999px;padding:6px 12px;cursor:pointer">Skip ›</button>
      <div class="overlay" id="ov"><span class="n" id="ovN"></span><span class="t" id="ovT"></span><span class="s" id="ovS"></span><button class="btn" id="ovBtn" hidden style="max-width:240px;margin-top:8px"></button></div>
    </div>
    <div class="quick" id="quick" hidden></div>
    <p class="tip" id="tip"></p>
    <div class="controls" id="controls"></div>
  </section>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-label="Chat">
  <header><span>Chat</span><button id="chatClose" aria-label="Close chat">×</button></header>
  <div class="msgs" id="msgs"></div>
  <form id="chatForm"><input id="chatIn" maxlength="140" placeholder="Message…" autocomplete="off" aria-label="Message"><button>Send</button></form>
</aside>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const show=id=>{document.querySelectorAll('.screen').forEach(s=>s.hidden=s.id!==id)};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{try{peer&&peer.destroy()}catch(_){}show('home')});

/* ================= sound ================= */
let ac=null;
function tone(f,d=.12,type='sine',v=.08,slide){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(_){}}
function noise(d=.2,f=800,v=.12){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,b=ac.createBuffer(1,Math.ceil(ac.sampleRate*d),ac.sampleRate),dd=b.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/dd.length,2);const s=ac.createBufferSource();s.buffer=b;const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;const g=ac.createGain();g.gain.value=v;s.connect(fl).connect(g).connect(ac.destination);s.start(t)}catch(_){}}
const sfx={step:()=>tone(300+Math.random()*60,.06,'triangle',.035,180),bump:()=>tone(120,.12,'square',.04,70),door:()=>{tone(220,.25,'sawtooth',.03,440);tone(660,.18,'sine',.05)},
 click:()=>tone(1500,.03,'square',.03),win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.28),i*110))},hurt:()=>tone(160,.35,'sawtooth',.07,60),
 good:()=>tone(880,.18),bad:()=>tone(200,.25,'square',.05,120),msg:()=>{tone(990,.07);setTimeout(()=>tone(1320,.09),70)},
 push:()=>{noise(.25,600,.15);tone(180,.2,'sine',.08,90)},pull:()=>{tone(300,.3,'sine',.07,900)},slide:()=>noise(.18,1500,.05),fill:()=>{noise(.3,400,.2);tone(90,.25,'sine',.1)},
 plant:()=>{tone(700,.08);setTimeout(()=>tone(900,.08),70)},rain:()=>noise(.6,3000,.06),grow:()=>{[392,494,587,784].forEach((f,i)=>setTimeout(()=>tone(f,.16,'triangle',.06),i*70))},
 boing:()=>tone(200,.35,'sine',.1,900),shield:()=>tone(520,.12,'triangle',.05,780),throwit:()=>tone(900,.12,'sine',.05,400),hit:()=>{noise(.2,2000,.12);tone(140,.25,'square',.06,60)},roar:()=>{noise(.8,300,.25);tone(70,.8,'sawtooth',.05,40)},zap:()=>noise(.25,5000,.12)};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(_){}};

/* ================= shared state ================= */
let mode='local',me='her',isHost=true,conn=null,peer=null;
const other=r=>r==='her'?'him':'her';
const COL={her:'#efb8b1',him:'#f3e3c3'},COL2={her:'#d9837c',him:'#c9a96e'},SAGE='#9fbf9a';
const cv=$('cv'),cx=cv.getContext('2d'),T=60,W=9,H=13;
if(!cx.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
let view='none',stepIdx=-1,runTok=0,score={her:0,him:0},parts=[],shake=0,flashT=0,lastT=0;
const bubbles={her:null,him:null};
function heartPath(x,y,s){cx.beginPath();cx.moveTo(x,y+s*.3);cx.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);cx.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.75,x,y+s);cx.bezierCurveTo(x,y+s*.75,x+s*.5,y+s*.6,x+s*.5,y+s*.3);cx.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);cx.closePath()}
function burst(x,y,col,n=14,spd=140,heart=false,grav=260){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=spd*(.4+Math.random()*.8);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:.7+Math.random()*.5,age:0,col,heart,r:2+Math.random()*3,g:grav})}}
const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
let ovTimer=0;
function overlay(n,t,s,ms,btn,fn){$('ovN').textContent=n;$('ovT').textContent=t;$('ovS').textContent=s;$('ov').classList.add('show');const b=$('ovBtn');
  if(btn){b.hidden=false;b.textContent=btn;b.onclick=fn}else b.hidden=true;clearTimeout(ovTimer);if(ms)ovTimer=setTimeout(()=>$('ov').classList.remove('show'),ms)}
const hideOv=()=>$('ov').classList.remove('show');
const tip=h=>$('tip').innerHTML=h;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= characters ================= */
const mv={her:{t:0,dx:0,dy:0,jump:0},him:{t:0,dx:0,dy:0,jump:0}};
function blob(r,px,py,t,cine,fx,fy,face){const m=cine?{t:-1e9,dx:fx||0,dy:fy||0,jump:0}:mv[r],age=(t-m.t)/1000;const c=COL[r];
  let sx=1,sy=1;if(age<.12){const k=age/.12;if(m.dx){sx=1+.22*(1-k);sy=1-.15*(1-k)}else if(m.dy){sy=1+.22*(1-k);sx=1-.15*(1-k)}}
  else if(age<.32){const k=(age-.12)/.2,w=Math.sin(k*Math.PI)*(1-k);sy=1-.14*w;sx=1+.12*w}
  const idle=Math.sin(t/420+(r==='her'?0:1.7)),bob=idle*1.6,breath=1+idle*.025;
  const jd=m.jump?.55:.14,hop=age<jd?Math.sin(age/jd*Math.PI)*(m.jump?70:7):0;
  cx.save();cx.translate(px,py+6);cx.fillStyle='rgba(0,0,0,.45)';cx.beginPath();cx.ellipse(0,16,16*sx*(1-hop/140),5,0,0,7);cx.fill();cx.restore();
  cx.save();cx.translate(px,py-hop+bob);cx.scale(sx*breath,sy/breath);
  const g=cx.createLinearGradient(0,-20,0,20);g.addColorStop(0,c);g.addColorStop(1,COL2[r]);cx.fillStyle=g;cx.shadowColor=c;cx.shadowBlur=16;
  cx.beginPath();cx.roundRect(-19,-19,38,37,[19,19,13,13]);cx.fill();cx.shadowBlur=0;
  const fdx=face?face.x:Math.max(-1,Math.min(1,m.dx||0)),fdy=face?face.y:Math.max(-1,Math.min(1,m.dy||0));const lx=fdx*2.5,ly=fdy*2;const blink=((t/1000+(r==='her'?0:1.3))%4)<.12;
  cx.fillStyle='#1a1414';if(blink){cx.fillRect(-10+lx,-4+ly,6,1.6);cx.fillRect(4+lx,-4+ly,6,1.6)}else{cx.beginPath();cx.arc(-7+lx,-3+ly,3.2,0,7);cx.arc(7+lx,-3+ly,3.2,0,7);cx.fill();cx.fillStyle='#fff';cx.beginPath();cx.arc(-6+lx,-4+ly,1,0,7);cx.arc(8+lx,-4+ly,1,0,7);cx.fill()}
  cx.fillStyle='rgba(217,131,124,.35)';cx.beginPath();cx.arc(-11,4,3.2,0,7);cx.arc(11,4,3.2,0,7);cx.fill();
  cx.fillStyle=r==='her'?'#c4615a':'#a8874c';heartPath(0,5,11);cx.fill();cx.restore();
  if(face&&!cine){cx.save();cx.translate(px+face.x*28,py+face.y*28-hop);cx.rotate(Math.atan2(face.y,face.x));cx.fillStyle=c;cx.globalAlpha=.8;cx.beginPath();cx.moveTo(6,0);cx.lineTo(-3,-5);cx.lineTo(-3,5);cx.fill();cx.restore()}}
function bubble(r,px,py,t){const b=bubbles[r];if(!b)return;const age=(t-b.t)/1000;if(age>3.5)return;const a=Math.min(1,age*5,(3.5-age)*2);
  cx.save();cx.globalAlpha=a;cx.font='500 17px Jost, sans-serif';let txt=b.text;if(txt.length>22)txt=txt.slice(0,21)+'…';const w=cx.measureText(txt).width+22;
  let bx=Math.max(4,Math.min(cv.width-w-4,px-w/2)),by=Math.max(4,py-66);cx.fillStyle=r===me?'#2a2120':'#f1e9e0';cx.beginPath();cx.roundRect(bx,by,w,32,12);cx.fill();
  cx.beginPath();cx.moveTo(px-6,by+32);cx.lineTo(px,by+40);cx.lineTo(px+6,by+32);cx.fill();cx.fillStyle=r===me?'#f1e9e0':'#1a1414';cx.textAlign='left';cx.fillText(txt,bx+11,by+22);cx.restore()}

/* ================= the chapter ================= */
const PIECES=3;
const MEM=['a shy first hello that changed everything','23.03, the day two families said yes','23.09, the day they said qubool hai'];
const STAGES={
 magnet:{name:'Magnet & Spark',powers:{her:'pull',him:'push'},sub:'Her power PULLS. His power PUSHES. Point with the arrows, then tap your power. Crates fill holes. People fly over them.',
  map:['#########',
       '#A.....B#',
       '####p####',
       '#.......#',
       '#.X...P.#',
       '#.......#',
       '#ooooooo#',
       '#.......#',
       '#.......#',
       '#ooooooo#',
       '#..X....#',
       '#a....b.#',
       '#########']},
 seed:{name:'Seed & Rain',powers:{her:'plant',him:'rain'},sub:'She plants seeds. He rains on them. Soil by a hole grows a vine bridge. Round soil grows a flower that bounces her high. His rain reaches two tiles. He’s too heavy for it 😛',
  map:['#########',
       '#A.....B#',
       '#ooooooo#',
       '#.....v.#',
       '#.P.....#',
       '#.......#',
       '####p####',
       '#.....f.#',
       '#ooooooo#',
       '#ooooooo#',
       '#.v.....#',
       '#a....b.#',
       '#########']}
};
const STEPS=[
 {k:'scene',id:'prologue'},{k:'scene',id:'magnet'},{k:'stage',id:'magnet'},{k:'scene',id:'out0'},
 {k:'mini',id:'tug'},
 {k:'scene',id:'seed'},{k:'stage',id:'seed'},{k:'scene',id:'out1'},
 {k:'mini',id:'chai'},
 {k:'scene',id:'boss'},{k:'boss'},{k:'scene',id:'out2'},
 {k:'scene',id:'end'},{k:'final'}];
const MILESTONES=STEPS.map((s,i)=>i).filter(i=>['stage','mini','boss'].includes(STEPS[i].k));
function dots(){const d=$('dots');if(d.children.length!==MILESTONES.length)d.innerHTML=MILESTONES.map(()=>'<i></i>').join('');[...d.children].forEach((e,j)=>e.classList.toggle('on',MILESTONES[j]<stepIdx))}

async function runStep(i){const tok=++runTok;stepIdx=i;dots();const s=STEPS[i];hideOv();$('controls').innerHTML='';tip('');
  if(!s)return;
  if(s.k==='scene'){view='scene';await playScene(s.id);if(tok!==runTok)return;if(isHost)goStep(i+1);else{overlay('','Waiting…','for your other half to finish the scene',0)}return}
  if(s.k==='stage'){loadStage(s.id,tok);return}
  if(s.k==='mini'){startMini(s.id,tok);return}
  if(s.k==='boss'){startBoss(tok);return}
  if(s.k==='final'){view='final';finT0=performance.now();sfx.win();
    overlay('Chapter 1 complete','Two halves.\nOne heart.',`Her ${score.her} · Him ${score.him} in the mini-games 😛\nChapter 2 · Riyadh, coming soon.`,0,'Play again',()=>{if(isHost)goStep(0);else send({t:'again'})})}
}
function goStep(n){if(!isHost)return;send({t:'step',i:n});runStep(n)}
let finT0=0;

/* ================= grid stages ================= */
let G=null; // {id,def,map,pos,face,crates,planted,playing}
function loadStage(id,tok){const def=STAGES[id];view='stage';
  G={id,def,tok,playing:false,map:def.map.map(r=>r.split('')),pos:{},face:{her:{x:0,y:-1},him:{x:0,y:-1}},crates:[],planted:[],rp:{},fx:[]};
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=G.map[y][x];if(c==='a'){G.pos.her={x,y};G.map[y][x]='.'}if(c==='b'){G.pos.him={x,y};G.map[y][x]='.'}if(c==='X'){G.crates.push({x,y});G.map[y][x]='.'}}
  G.start={her:{...G.pos.her},him:{...G.pos.him}};G.rp={her:{...G.pos.her},him:{...G.pos.him}};
  buildStageControls();
  overlay('Power up',def.name,def.sub,5200);
  setTimeout(()=>{if(G&&G.tok===tok){G.playing=true;stageTip()}},5200)}
function stageTip(){const p=G.def.powers;const nm={pull:'PULL ♥',push:'PUSH ✦',plant:'PLANT 🌱',rain:'RAIN ☁'};
  tip(mode==='local'?`<b>Her: ${nm[p.her]}</b> · <b>Him: ${nm[p.him]}</b>. Face a thing with the arrows, then tap the power.`:`Your power: <b>${nm[p[me]]}</b>. Face it with the arrows, then tap the middle button.`)}
const gt=(x,y)=>(x<0||y<0||x>=W||y>=H)?'#':G.map[y][x];
const crateAt=(x,y)=>G.crates.find(c=>c.x===x&&c.y===y);
const playerAt=(x,y)=>['her','him'].find(r=>G.pos[r].x===x&&G.pos[r].y===y);
function doorOpen(){for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(G.map[y][x]==='P'&&(crateAt(x,y)||playerAt(x,y)))return true;return false}
function blocked(x,y){const c=gt(x,y);return c==='#'||(c==='p'&&!doorOpen())}
function gmove(r,dx,dy){if(!G||!G.playing)return;if(mode==='net'&&r!==me)return;
  G.face[r]={x:dx,y:dy};const p=G.pos[r],nx=p.x+dx,ny=p.y+dy,c=gt(nx,ny);
  if(blocked(nx,ny)||c==='o'||c==='v'||c==='f'||crateAt(nx,ny)||playerAt(nx,ny)){sfx.bump();buzz(12);mv[r]={t:performance.now(),dx:dx*.2,dy:dy*.2};sync();return}
  const before=doorOpen();p.x=nx;p.y=ny;mv[r]={t:performance.now(),dx,dy};sfx.step();if(doorOpen()!==before)sfx.door();
  if(c==='F'){if(r==='her')launch(r);else{tip('<b>Too heavy</b> for the flower 😛 Only she can bounce.');sfx.boing()}}
  sync();checkStageWin()}
function launch(r){const p=G.pos[r];const ty=p.y-3;if(ty>0&&!blocked(p.x,ty)&&gt(p.x,ty)!=='o'&&!crateAt(p.x,ty)&&!playerAt(p.x,ty)){sfx.boing();buzz(40);burst(p.x*T+T/2,p.y*T+T/2,COL.her,16,160,true);p.y=ty;mv[r]={t:performance.now(),dx:0,dy:-3,jump:1}}}
function power(r){if(!G||!G.playing)return;if(mode==='net'&&r!==me)return;const pw=G.def.powers[r],f=G.face[r],p=G.pos[r];
  if(pw==='push'||pw==='pull'){let tgt=null;for(let i=1;i<=6;i++){const x=p.x+f.x*i,y=p.y+f.y*i;if(blocked(x,y))break;const cr=crateAt(x,y),pl=playerAt(x,y);if(cr){tgt={kind:'crate',o:cr};break}if(pl){tgt={kind:'player',r:pl};break}}
    G.fx.push({k:pw,x:p.x,y:p.y,f:{...f},t:performance.now()});
    if(!tgt){pw==='push'?sfx.push():sfx.pull();tip('Nothing in line. <b>Face a crate or your other half</b> first.');sync();return}
    pw==='push'?sfx.push():sfx.pull();buzz(30);slide(tgt,pw==='push'?f:{x:-f.x,y:-f.y},pw==='pull'?r:null);sync();checkStageWin();return}
  let tx=p.x+f.x,ty=p.y+f.y;if(pw==='rain'&&!['v','f'].includes(gt(tx,ty))&&['v','f'].includes(gt(tx+f.x,ty+f.y))){tx+=f.x;ty+=f.y}
  const c=gt(tx,ty),key=tx+','+ty;
  if(pw==='plant'){if((c==='v'||c==='f')&&!G.planted.includes(key)){G.planted.push(key);sfx.plant();burst(tx*T+T/2,ty*T+T/2,SAGE,10,80)}else{sfx.bump();tip('<b>Face a patch of soil</b> to plant.')}sync();return}
  if(pw==='rain'){G.fx.push({k:'rain',x:tx,y:ty,t:performance.now()});sfx.rain();
    if((c==='v'||c==='f')&&G.planted.includes(key)){setTimeout(()=>grow(tx,ty,c),500)}else if(c==='v'||c==='f')tip('Nothing planted there yet. <b>She plants first.</b>');else tip('<b>Face the soil</b> to rain on it.');sync();return}}
function grow(x,y,c){sfx.grow();burst(x*T+T/2,y*T+T/2,SAGE,20,150,true);G.planted=G.planted.filter(k=>k!==x+','+y);
  if(c==='v'){G.map[y][x]='.';let yy=y-1;while(gt(x,yy)==='o'){G.map[yy][x]='=';yy--}}else G.map[y][x]='F';sync()}
function slide(t,d,puller){let steps=0;const get=()=>t.kind==='crate'?t.o:G.pos[t.r];
  while(steps<7){const o=get(),nx=o.x+d.x,ny=o.y+d.y;if(blocked(nx,ny)||crateAt(nx,ny)||playerAt(nx,ny))break;
    o.x=nx;o.y=ny;steps++;
    if(t.kind==='crate'&&gt(nx,ny)==='o'){G.map[ny][nx]='_';G.crates=G.crates.filter(c=>c!==o);sfx.fill();shake=8;burst(nx*T+T/2,ny*T+T/2,'#8a7560',16,120);return}}
  if(steps)sfx.slide();
  if(t.kind==='player'){mv[t.r]={t:performance.now(),dx:d.x,dy:d.y};const o=get();if(gt(o.x,o.y)==='o'){fall(t.r)}}}
function fall(r){sfx.hurt();buzz(150);shake=12;flashT=performance.now();tip('<b>Into the hole!</b> The stage resets. Plan it in the chat.');
  setTimeout(()=>{if(!G)return;const id=G.id,tok=G.tok;const def=STAGES[id];G.map=def.map.map(r=>r.split(''));G.crates=[];G.planted=[];
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=G.map[y][x];if(c==='a'||c==='b')G.map[y][x]='.';if(c==='X'){G.crates.push({x,y});G.map[y][x]='.'}}
    G.pos={her:{...G.start.her},him:{...G.start.him}};sync()},450)}
function checkStageWin(){if(!isHost||!G||!G.playing)return;if(gt(G.pos.her.x,G.pos.her.y)==='A'&&gt(G.pos.him.x,G.pos.him.y)==='B'){G.playing=false;sfx.win();buzz(80);
  ['her','him'].forEach(r=>burst(G.pos[r].x*T+T/2,G.pos[r].y*T+T/2,COL[r],24,180,true));const i=stepIdx;setTimeout(()=>{if(stepIdx===i)goStep(i+1)},1300)}}
function sync(){send({t:'g',s:stepIdx,map:G.map.map(r=>r.join('')),pos:G.pos,face:G.face,crates:G.crates,planted:G.planted})}
function applyG(o){if(!G||o.s!==stepIdx)return;const oldP=JSON.stringify(G.pos);G.map=o.map.map(r=>r.split(''));
  ['her','him'].forEach(r=>{const a=G.pos[r],b=o.pos[r];if(a.x!==b.x||a.y!==b.y){const dy=b.y-a.y,dx=b.x-a.x;mv[r]={t:performance.now(),dx:Math.sign(dx),dy:Math.sign(dy),jump:dy<=-3&&dx===0?1:0}}});
  G.pos=o.pos;G.face=o.face;G.crates=o.crates;G.planted=o.planted;checkStageWin()}
function drawStage(t,dt){if(!G)return;const k=1-Math.pow(.0005,dt);
  ['her','him'].forEach(r=>{const a=G.rp[r],b=G.pos[r];a.x+=(b.x-a.x)*k;a.y+=(b.y-a.y)*k;if(Math.abs(b.x-a.x)>8||Math.abs(b.y-a.y)>8){a.x=b.x;a.y=b.y}});
  const open=doorOpen();
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=G.map[y][x],X=x*T,Y=y*T;
    if(c==='#'){const g=cx.createLinearGradient(X,Y,X,Y+T);g.addColorStop(0,'#241e1d');g.addColorStop(1,'#171313');cx.fillStyle=g;cx.fillRect(X,Y,T,T);cx.fillStyle='rgba(255,255,255,.035)';cx.fillRect(X,Y,T,3);continue}
    cx.fillStyle=(x+y)%2?'#121010':'#141111';cx.fillRect(X,Y,T,T);
    if(c==='o'){const g=cx.createRadialGradient(X+T/2,Y+T/2,4,X+T/2,Y+T/2,T*.7);g.addColorStop(0,'#000');g.addColorStop(1,'#0e0b0b');cx.fillStyle=g;cx.fillRect(X+2,Y+2,T-4,T-4);cx.strokeStyle='#241e1d';cx.lineWidth=2;cx.strokeRect(X+3,Y+3,T-6,T-6)}
    if(c==='_'){cx.fillStyle='#4a3d32';cx.fillRect(X+3,Y+3,T-6,T-6);cx.strokeStyle='#6b5a4a';cx.lineWidth=2;cx.strokeRect(X+6,Y+6,T-12,T-12)}
    if(c==='='){cx.fillStyle='#16201a';cx.fillRect(X+2,Y,T-4,T);cx.strokeStyle=SAGE;cx.lineWidth=4;cx.beginPath();for(let i=0;i<=T;i+=5){const xx=X+T/2+Math.sin((Y+i)/9)*12;i?cx.lineTo(xx,Y+i):cx.moveTo(xx,Y)}cx.stroke();cx.fillStyle=SAGE;for(let i=0;i<3;i++){cx.beginPath();cx.ellipse(X+T/2+(i%2?14:-14),Y+10+i*18,7,4,i%2?.6:-.6,0,7);cx.fill()}}
    if(c==='v'||c==='f'){const pl=G.planted.includes(x+','+y);cx.fillStyle='#3a2c22';cx.beginPath();if(c==='f')cx.arc(X+T/2,Y+T/2,20,0,7);else cx.roundRect(X+8,Y+14,T-16,T-28,8);cx.fill();cx.fillStyle='#4e3b2d';for(let i=0;i<5;i++)cx.fillRect(X+14+i*7,Y+T/2-2+(i%2)*4,3,3);
      if(pl){const sw=Math.sin(t/300)*3;cx.strokeStyle=SAGE;cx.lineWidth=3;cx.beginPath();cx.moveTo(X+T/2,Y+T/2+6);cx.quadraticCurveTo(X+T/2+sw,Y+T/2-4,X+T/2+sw,Y+T/2-10);cx.stroke();cx.fillStyle=SAGE;cx.beginPath();cx.ellipse(X+T/2+sw-5,Y+T/2-10,5,3,-.5,0,7);cx.ellipse(X+T/2+sw+5,Y+T/2-12,5,3,.5,0,7);cx.fill()}}
    if(c==='F'){const s=1+Math.sin(t/250)*.06;cx.save();cx.translate(X+T/2,Y+T/2);cx.scale(s,s);for(let i=0;i<6;i++){cx.rotate(Math.PI/3);cx.fillStyle=i%2?COL.her:'#f7cdc7';cx.beginPath();cx.ellipse(0,-14,8,13,0,0,7);cx.fill()}cx.fillStyle='#f3e3c3';cx.beginPath();cx.arc(0,0,8,0,7);cx.fill();cx.restore()}
    if(c==='A'||c==='B'){const col=c==='A'?COL.her:COL.him,pul=1+Math.sin(t/300)*.06;cx.save();cx.translate(X+T/2,Y+T/2);cx.scale(pul,pul);cx.strokeStyle=col;cx.lineWidth=2.5;cx.shadowColor=col;cx.shadowBlur=10;heartPath(0,-15,30);cx.stroke();cx.restore()}
    if(c==='P'){const on=!!(crateAt(x,y)||playerAt(x,y));cx.fillStyle='#0c0a0a';cx.beginPath();cx.ellipse(X+T/2,Y+T/2+4,19,10,0,0,7);cx.fill();cx.fillStyle='#cfc6c0';cx.globalAlpha=on?1:.45;cx.beginPath();cx.ellipse(X+T/2,Y+T/2+(on?3:0),17,9,0,0,7);cx.fill();cx.globalAlpha=1}
    if(c==='p'){cx.fillStyle='#0c0a0a';cx.fillRect(X+2,Y+2,T-4,T-4);cx.save();cx.beginPath();cx.rect(X,Y,T,T);cx.clip();G.doorAmt=(G.doorAmt||0)+((open?1:0)-(G.doorAmt||0))*Math.min(1,dt*10);const lift=G.doorAmt*(T-6);
      for(let i=0;i<4;i++){const bx=X+7+i*12;cx.fillStyle='#cfc6c0';cx.fillRect(bx,Y+4-lift,6,T-8)}cx.restore();cx.strokeStyle='#cfc6c0';cx.globalAlpha=.5;cx.strokeRect(X+3,Y+3,T-6,T-6);cx.globalAlpha=1}
  }
  G.crates.forEach(c=>{const X=c.x*T,Y=c.y*T;c.rx=c.rx==null?X:c.rx+(X-c.rx)*k;c.ry=c.ry==null?Y:c.ry+(Y-c.ry)*k;const x=c.rx,y=c.ry;cx.fillStyle='rgba(0,0,0,.4)';cx.fillRect(x+8,y+T-10,T-12,6);
    cx.fillStyle='#6b5a4a';cx.fillRect(x+5,y+5,T-10,T-12);cx.strokeStyle='#8a7560';cx.lineWidth=3;cx.strokeRect(x+7,y+7,T-14,T-16);cx.beginPath();cx.moveTo(x+8,y+8);cx.lineTo(x+T-8,y+T-10);cx.stroke();cx.fillStyle=COL.her;heartPath(x+T/2,y+T/2-8,14);cx.fill()});
  // power effects
  G.fx=G.fx.filter(f=>t-f.t<600);G.fx.forEach(f=>{const a=1-(t-f.t)/600,X=f.x*T+T/2,Y=f.y*T+T/2;
    if(f.k==='push'){cx.strokeStyle=`rgba(243,227,195,${a})`;cx.lineWidth=4;for(let i=0;i<3;i++){const d=20+(1-a)*160+i*30;cx.beginPath();cx.arc(X+f.f.x*d,Y+f.f.y*d,14+i*4,Math.atan2(f.f.y,f.f.x)-1,Math.atan2(f.f.y,f.f.x)+1);cx.stroke()}}
    if(f.k==='pull'){cx.strokeStyle=`rgba(239,184,177,${a})`;cx.lineWidth=3;cx.setLineDash([8,8]);cx.lineDashOffset=(t/20);cx.beginPath();cx.moveTo(X,Y);cx.lineTo(X+f.f.x*T*6,Y+f.f.y*T*6);cx.stroke();cx.setLineDash([])}
    if(f.k==='rain'){cx.fillStyle=`rgba(180,200,220,${a*.8})`;cx.beginPath();cx.ellipse(X,Y-46,30,12,0,0,7);cx.fill();for(let i=0;i<10;i++){const rx=X-24+i*5,ry=Y-36+((t/3+i*17)%40);cx.fillRect(rx,ry,1.5,7)}}});
  ['her','him'].forEach(r=>blob(r,G.rp[r].x*T+T/2,G.rp[r].y*T+T/2,t,false,0,0,G.face[r]));

/* ================= controls ================= */
const POWLBL={pull:['♥','PULL'],push:['✦','PUSH'],plant:['🌱','PLANT'],rain:['☁','RAIN']};
function padHTML(role,small,pw){const r=role?` data-r="${role}"`:'';const L=POWLBL[pw]||['',''];const cls=role||me;
  return `<div class="pad ${role||''} ${small?'small':''}"><span></span><button${r} data-d="0,-1" aria-label="Up">▲</button><span></span><button${r} data-d="-1,0" aria-label="Left">◀</button><button${r} class="pow ${cls}" data-pow="1" aria-label="${L[1]}"><b>${L[0]}</b>${L[1]}</button><button${r} data-d="1,0" aria-label="Right">▶</button><span></span><button${r} data-d="0,1" aria-label="Down">▼</button><span></span></div>`}
function holdBtn(b,fn,repeat){let rep=0,hold=0;b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('down');fn();if(repeat){clearTimeout(hold);clearInterval(rep);hold=setTimeout(()=>{rep=setInterval(fn,170)},320)}});
  ['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>{b.classList.remove('down');clearTimeout(hold);clearInterval(rep)}))}
function buildStageControls(){const c=$('controls'),p=G.def.powers;
  c.innerHTML=mode==='local'?padHTML('her',true,p.her)+padHTML('him',true,p.him):padHTML('',false,p[me]);
  c.querySelectorAll('button').forEach(b=>{const r=b.dataset.r||me;if(b.dataset.pow)holdBtn(b,()=>power(r),false);else{const [dx,dy]=b.dataset.d.split(',').map(Number);holdBtn(b,()=>gmove(r,dx,dy),true)}})}
const KEYS={ArrowUp:['her',0,-1],ArrowDown:['her',0,1],ArrowLeft:['her',-1,0],ArrowRight:['her',1,0],w:['him',0,-1],s:['him',0,1],a:['him',-1,0],d:['him',1,0]};
const keysDown={};
document.addEventListener('keydown',e=>{if($('game').hidden||document.activeElement===$('chatIn'))return;keysDown[e.key]=1;
  if(view==='stage'){if(e.key===' '||e.key==='Enter'){e.preventDefault();power(mode==='local'?'her':me);return}if(e.key==='e'||e.key==='q'){power(mode==='local'?'him':me);return}
    const k=KEYS[e.key]||KEYS[(e.key||'').toLowerCase()];if(!k)return;e.preventDefault();gmove(mode==='local'?k[0]:me,k[1],k[2])}
  if(view==='mini'&&!e.repeat){if(e.key===' '||e.key==='Enter'){e.preventDefault();miniPress(mode==='local'?'her':me)}if(e.key==='e'||e.key==='q')miniPress(mode==='local'?'him':me)}});
document.addEventListener('keyup',e=>{delete keysDown[e.key];if(view==='mini'){if(e.key===' '||e.key==='Enter')miniRelease(mode==='local'?'her':me);if(e.key==='e'||e.key==='q')miniRelease(mode==='local'?'him':me)}});
(()=>{let sx=0,sy=0,act=false;const bw=$('bw');
  bw.addEventListener('pointerdown',e=>{act=true;sx=e.clientX;sy=e.clientY});
  bw.addEventListener('pointerup',e=>{if(!act)return;act=false;if(view!=='stage')return;const dx=e.clientX-sx,dy=e.clientY-sy;const r=mode==='local'?(e.clientX<bw.getBoundingClientRect().left+bw.clientWidth/2?'her':'him'):me;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24){return}
    if(Math.abs(dx)>Math.abs(dy))gmove(r,Math.sign(dx),0);else gmove(r,0,Math.sign(dy))})})();

/* ================= mini-games ================= */
let M=null;
function startMini(id,tok){view='mini';M={id,tok,phase:'count',t0:performance.now(),v:0,cup:{her:0,him:0},pour:{her:false,him:false},done:{her:null,him:null},target:.55+Math.random()*.3,res:null};
  if(id==='chai'&&isHost){send({t:'chaiT',v:M.target})}
  const name=id==='tug'?'Tug of war':'Chai pour';const sub=id==='tug'?'Tap as fast as you can. Drag the heart to your side.':'Hold to pour. Let go as close to the line as you can. Spill it and you lose 😛';
  overlay('Mini-game',name,sub,2600);
  const c=$('controls');const lbl=id==='tug'?'TAP!':'HOLD TO POUR';
  c.innerHTML='<div class="big">'+(mode==='local'?`<button data-r="her">${lbl}<br><small>HER</small></button><button class="him" data-r="him">${lbl}<br><small>HIM</small></button>`:`<button class="${me}" data-r="${me}">${lbl}</button>`)+'</div>';
  c.querySelectorAll('button').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('down');miniPress(b.dataset.r)});['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>{b.classList.remove('down');miniRelease(b.dataset.r)}))});
  tip(id==='tug'?'First to pull the heart all the way wins a point.':'Closest to the line wins a point.');
  setTimeout(()=>{if(M&&M.tok===tok){M.phase='go';M.t0=performance.now();sfx.good()}},2600+3000)}
function miniPress(r){if(!M||M.phase!=='go')return;if(mode==='net'&&r!==me)return;
  if(M.id==='tug'){tone(r==='her'?600:480,.05,'triangle',.05);if(isHost)tug(r);else send({t:'tug',r})}
  if(M.id==='chai'&&M.done[r]==null){M.pour[r]=true}}

       {d:5200,txt:'The Distance. Made of every missed call, and every “seen” left unanswered.',f:(t,k)=>{sky(t,0);cx.fillStyle='rgba(0,0,0,.6)';cx.fillRect(0,0,540,780);bossCloud(270,200,t,1,1.3);for(let i=0;i<8;i++){const y=(t/4+i*90)%500+180;cx.fillStyle=i%2?'#3a3238':'#7fa7d9';cx.font='600 18px Jost, sans-serif';cx.fillText(i%2?'✕':'✓✓',60+i*58,y)}blob('her',220,620,t,true,1,-1);blob('him',320,620,t,true,-1,-1)}}],
 end:[
  {d:4400,txt:'With every piece found, the heart remembered who it belonged to.',f:(t,k)=>{room(t);heartFill(PIECES,1,t);blob('her',210,600,t,true,1,-1);blob('him',330,600,t,true,-1,-1)}},
  {d:5200,txt:'And somewhere between Karachi and Riyadh, two halves became one heart again.',f:(t,k)=>{sky(t,1);const e=ease(Math.min(1,k*1.3));cx.fillStyle=COL.her;heartHalf(270-120*(1-e),210,220,true);cx.fillStyle=COL.him;heartHalf(270+120*(1-e),210,220,false);if(k>.75&&Math.random()<.4)burst(270,330,Math.random()<.5?COL.her:COL.him,2,180,true)}},
  {d:5000,txt:'But their story was only beginning. Next stop: one home, in Riyadh.',f:(t,k)=>{sky(t,.9);skyline(0,'r');skyline(1,'r');moon(270,190,1);blob('her',250,590,t,true,0,-1);blob('him',290,590,t,true,0,-1);dil(400,300,t,1)}},
  {d:4200,txt:'Chapter 2 · Riyadh. Coming soon.',f:(t,k)=>{cx.fillStyle='#000';cx.fillRect(0,0,540,780);cx.save();cx.globalAlpha=Math.min(1,k*3);cx.textAlign='center';cx.fillStyle='#a59c95';cx.font='500 13px Jost, sans-serif';cx.fillText('CHAPTER ONE COMPLETE',270,330);cx.fillStyle='#f1e9e0';cx.font='italic 500 46px "Cormorant Garamond", serif';cx.fillText('To be continued',270,400);cx.fillStyle=COL.her;cx.font='500 12px Jost, sans-serif';cx.fillText('CHAPTER TWO · RIYADH',270,440);cx.restore()}}]
};
const OUTRO=['The crates settled. Under the last one, the first piece was waiting:','The vines bloomed, and held the second piece:','The Distance broke into a thousand stars. In its place, the last piece:'];
for(let n=0;n<PIECES;n++)STORY['out'+n]=[{d:5600,txt:OUTRO[n]+' '+MEM[n]+'.',f:(t,k)=>{room(t);const fly=ease(Math.min(1,k*1.6));heartFill(n,1,t);if(k<.6)shard(270,120+190*fly,n,1.8-fly*.8);else heartFill(n+1,Math.min(1,(k-.6)*3),t);blob('her',190,620,t,true,1,-1);blob('him',350,620,t,true,-1,-1)}}];
function sky(t,warm){const g=cx.createLinearGradient(0,0,0,780);g.addColorStop(0,'#07060a');g.addColorStop(1,`rgb(${20+30*warm},${14+12*warm},${18+8*warm})`);cx.fillStyle=g;cx.fillRect(0,0,540,780);
  for(let i=0;i<60;i++){const x=(i*97)%540,y=70+(i*53)%380,tw=.4+.6*Math.abs(Math.sin(t/700+i));cx.globalAlpha=tw*.8;cx.fillStyle='#f1e9e0';cx.fillRect(x,y,1.6,1.6)}cx.globalAlpha=1}
function room(t){const g=cx.createRadialGradient(270,380,40,270,380,520);g.addColorStop(0,'#2a2120');g.addColorStop(1,'#0a0808');cx.fillStyle=g;cx.fillRect(0,0,540,780);cx.fillStyle='#161212';cx.fillRect(0,610,540,170)}
function glowHeart(x,y,s,k){cx.save();cx.shadowColor='#efb8b1';cx.shadowBlur=40;const g=cx.createLinearGradient(x-s/2,0,x+s/2,0);g.addColorStop(0,COL.her);g.addColorStop(.5,COL.her);g.addColorStop(.5,COL.him);g.addColorStop(1,COL.him);cx.fillStyle=g;cx.globalAlpha=Math.min(1,k*2);heartPath(x,y-s*.45,s);cx.fill();cx.restore()}
function heartHalf(x,y,s,left){cx.save();cx.beginPath();if(left)cx.rect(x-s,y-s*.2,s,s*1.6);else cx.rect(x,y-s*.2,s,s*1.6);cx.clip();heartPath(x,y,s);cx.fill();cx.restore()}
function crack(x,y,k){cx.strokeStyle='#0a0808';cx.lineWidth=5;cx.beginPath();cx.moveTo(x,y-70);cx.lineTo(x+12,y-30);cx.lineTo(x-10,y);cx.lineTo(x+8,y+40*k);cx.stroke()}
function skyline(side,kind){const x0=side?270:0;cx.fillStyle=side?'#1c1916':'#191517';for(let i=0;i<9;i++){const w=22+((i*37)%18),h=kind==='r'?60+((i*71)%150)+(i===4?120:0):40+((i*53)%90);cx.fillRect(x0+10+i*28,650-h,w,h+130)}
  if(kind==='k'){cx.fillStyle='#14202a';cx.fillRect(0,680,270,100)}cx.fillStyle='rgba(243,227,195,.5)';for(let i=0;i<24;i++){cx.fillRect(x0+16+(i*41)%240,560+(i*29)%90,3,4)}}
function moon(x,y,k){cx.save();cx.shadowColor='#f1e9e0';cx.shadowBlur=40;cx.fillStyle='#f1e9e0';cx.globalAlpha=Math.min(1,k*2);cx.beginPath();cx.arc(x,y,44,0,7);cx.fill();cx.shadowBlur=0;cx.fillStyle='#09070b';cx.beginPath();cx.arc(x+18,y-8,40,0,7);cx.fill();cx.restore()}
function dashLine(x1,y1,x2,y2,k){cx.strokeStyle='rgba(239,184,177,.6)';cx.setLineDash([6,8]);cx.lineWidth=2;cx.beginPath();cx.moveTo(x1,y1);cx.lineTo(x1+(x2-x1)*k,y1+(y2-y1)*k);cx.stroke();cx.setLineDash([])}
function dil(x,y,t,k){const bob=Math.sin(t/300)*8,a=Math.min(1,k*2.5);cx.save();cx.globalAlpha=a;cx.translate(x,y+bob);cx.rotate(Math.sin(t/500)*.12);cx.shadowColor='#fff3e6';cx.shadowBlur=24;cx.fillStyle='#fff3e6';heartPath(0,-26,52);cx.fill();cx.shadowBlur=0;
  cx.strokeStyle='rgba(0,0,0,.12)';cx.lineWidth=1;cx.beginPath();cx.moveTo(-20,-12);cx.lineTo(0,8);cx.lineTo(20,-12);cx.stroke();cx.fillStyle='#1a1414';const wink=((t/1000)%3)<.15;cx.beginPath();cx.arc(-8,-6,2.6,0,7);cx.fill();if(wink)cx.fillRect(5,-7,7,2);else{cx.beginPath();cx.arc(8,-6,2.6,0,7);cx.fill()}
  cx.strokeStyle='#1a1414';cx.lineWidth=1.6;cx.beginPath();cx.arc(0,0,5,.2,Math.PI-.2);cx.stroke();cx.restore()}
function shard(x,y,n,z=1){const col=n%2?COL.him:COL.her;cx.save();cx.translate(x,y);cx.scale(z,z);cx.rotate(Math.PI/4+Math.sin(performance.now()/400+n)*.2);cx.shadowColor=col;cx.shadowBlur=18;cx.fillStyle=col;cx.fillRect(-10,-10,20,20);cx.restore();cx.shadowBlur=0}
function heartFill(n,a,t){const s=230,x=270,y=180;cx.save();cx.lineWidth=3;cx.strokeStyle='rgba(239,184,177,.6)';heartPath(x,y,s);cx.stroke();cx.clip();
  const prev=Math.max(0,n-1)/PIECES,cur=n/PIECES,frac=prev+(cur-prev)*a,top=y+s-(s+10)*frac;const g=cx.createLinearGradient(x-s/2,0,x+s/2,0);g.addColorStop(0,COL.her);g.addColorStop(.5,COL.her);g.addColorStop(.5,COL.him);g.addColorStop(1,COL.him);cx.fillStyle=g;cx.globalAlpha=.85;cx.fillRect(x-s,top,s*2,s*2);cx.restore();
  cx.textAlign='center';cx.fillStyle='#a59c95';cx.font='500 12px Jost, sans-serif';cx.fillText(Math.min(PIECES,n)+' / '+PIECES+' PIECES',x,y+s+34);cx.textAlign='left'}
function crateArt(x,y,s){cx.save();cx.translate(x,y);cx.scale(s,s);cx.fillStyle='#6b5a4a';cx.fillRect(-25,-25,50,48);cx.strokeStyle='#8a7560';cx.lineWidth=3;cx.strokeRect(-22,-22,44,42);cx.fillStyle=COL.her;heartPath(0,-10,16);cx.fill();cx.restore()}
function bossCloud(x,y,t,k,s=1){cx.save();cx.translate(x,y);cx.scale(s,s);cx.globalAlpha=Math.min(1,k*1.5);[[-90,10,52],[-45,-22,60],[10,-30,66],[60,-14,58],[100,14,46],[-20,20,62],[40,22,58]].forEach(([px,py,r],i)=>{const g=cx.createRadialGradient(px,py-r*.4,4,px,py,r);g.addColorStop(0,'#4a4450');g.addColorStop(1,'#26222b');cx.fillStyle=g;cx.beginPath();cx.arc(px+Math.sin(t/500+i)*3,py,r,0,7);cx.fill()});
  cx.fillStyle='#ff8f86';[-30,30].forEach((ex,i)=>{cx.beginPath();cx.ellipse(ex,-12,8,5,i?-.3:.3,0,7);cx.fill()});cx.restore()}
function playScene(id){return new Promise(res=>{const shots=STORY[id];if(!shots){res();return}scene={shots,i:0,t0:performance.now(),res};$('skip').hidden=false})}
function endScene(){if(!scene)return;const r=scene.res;scene=null;$('skip').hidden=true;r()}
function drawScene(t){const sh=scene.shots[scene.i];let k=(t-scene.t0)/sh.d;
  if(k>=1){scene.i++;scene.t0=t;if(scene.i>=scene.shots.length){endScene();return}return drawScene(t)}
  cx.save();const z=1+.05*k;cx.translate(270,390);cx.scale(z,z);cx.translate(-270,-390);sh.f(t,k);cx.restore();
  const bar=64;cx.fillStyle='#000';cx.fillRect(0,0,540,bar);cx.fillRect(0,780-bar-70,540,bar+70);
  const chars=Math.floor(sh.txt.length*Math.min(1,k*2.2));cx.font='italic 500 27px "Cormorant Garamond", serif';cx.fillStyle='#f1e9e0';cx.textAlign='center';wrapText(sh.txt.slice(0,chars),270,780-bar-34,470,30);cx.textAlign='left';
  const f=Math.min(1,k*6,(1-k)*6);cx.fillStyle=`rgba(0,0,0,${1-f})`;cx.fillRect(0,0,540,780)}
function wrapText(s,x,y,maxW,lh){const words=s.split(' ');let line='',lines=[];for(const w of words){const tst=line?line+' '+w:w;if(cx.measureText(tst).width>maxW&&line){lines.push(line);line=w}else line=tst}lines.push(line);lines.forEach((l,i)=>cx.fillText(l,x,y+i*lh))}
function drawFinal(t){sky(t,1);const e=Math.min(1,(t-finT0)/1600),s=230+Math.sin(t/320)*6*e;cx.fillStyle=COL.her;heartHalf(270-110*(1-ease(e)),170,s,true);cx.fillStyle=COL.him;heartHalf(270+110*(1-ease(e)),170,s,false);if(e>=1&&Math.random()<.2)burst(270+(Math.random()-.5)*300,560,Math.random()<.5?COL.her:COL.him,1,120,true)}

/* ================= chat ================= */
const QUICK=['⬆️ up','⬇️ down','⬅️ left','➡️ right','💥 use power!','✋ stop','⏳ wait','🟢 go!','👍 ok','🤔 how?','❤️'];
let unread=0;
function buildQuick(){const q=$('quick');q.hidden=mode!=='net';if(mode!=='net')return;
  q.innerHTML='<button class="open" id="openChat">💬 Chat<span class="badge" id="badge" hidden>0</span></button>'+QUICK.map(t=>`<button data-q="${t}">${t}</button>`).join('');
  q.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>chat(b.dataset.q));$('openChat').onclick=openChat}
function chat(text){text=text.trim();if(!text)return;addMsg(me,text);send({t:'chat',text})}
function addMsg(r,text){const m=document.createElement('div');m.className='msg '+(r===me?'me':'them')+' '+r;m.textContent=text;$('msgs').appendChild(m);$('msgs').scrollTop=1e6;bubbles[r]={text,t:performance.now()};
  if(r!==me){sfx.msg();buzz(25);if(!$('sheet').classList.contains('open')){unread++;const b=$('badge');if(b){b.hidden=false;b.textContent=unread}}}}
function openChat(){$('sheet').classList.add('open');$('scrim').classList.add('open');unread=0;const b=$('badge');if(b)b.hidden=true;setTimeout(()=>$('chatIn').focus(),250)}
function closeChat(){$('sheet').classList.remove('open');$('scrim').classList.remove('open');$('chatIn').blur()}
$('chatClose').onclick=closeChat;$('scrim').onclick=closeChat;$('chatForm').onsubmit=e=>{e.preventDefault();chat($('chatIn').value);$('chatIn').value=''};
$('skip').onclick=e=>{e.stopPropagation();endScene()};

/* ================= networking ================= */
function send(o){if(mode==='net'&&conn&&conn.open)try{conn.send(o)}catch(_){}}
function onMsg(o){switch(o.t){
  case 'hello':me=other(o.hostRole);startNet();break;
  case 'chat':addMsg(other(me),String(o.text).slice(0,140));break;
  case 'step':if(scene){const s=scene;scene=null;$('skip').hidden=true}runStep(o.i);break;
  case 'again':if(isHost)goStep(0);break;
  case 'g':applyG(o);break;
  case 'tug':if(isHost&&M)tug(o.r);break;
  case 'tugv':if(M){M.v=o.v;tone(500,.04,'triangle',.03)}break;
  case 'chaiT':if(M)M.target=o.v;break;
  case 'chai':if(M){M.done[o.r]=o.v;M.cup[o.r]=o.v;chaiCheck()}break;
  case 'mres':if(M&&!M.res){M.res=o.w;M.phase='end';score=o.score;sfx.win();miniEnd()}break;
  case 'bin':if(isHost&&B){B.inp[o.r]=o.inp;B.p[o.r].x=o.x;if(o.r==='her')B.p.her.sh=!!o.inp.a}break;
  case 'bs':applyB(o);break;
  case 'btip':tip(o.h);break;
}}
const CODE_CH='ABCDEFGHJKMNPQRSTUVWXYZ23456789',PREFIX='twohalves-together-';
function makeCode(){let s='';for(let i=0;i<4;i++)s+=CODE_CH[Math.floor(Math.random()*CODE_CH.length)];return s}
function netStatus(ok){$('net').textContent=ok?'● connected':'● offline';$('net').style.color=ok?'#9fd3a8':'#d9837c'}
function wire(c){conn=c;c.on('data',onMsg);c.on('close',()=>{netStatus(false);overlay('Connection lost','Hold on','Your other half disconnected. Go back and join again.',0,'Back to start',()=>location.reload())});c.on('error',()=>netStatus(false))}
const BC=location.search.includes('bc');
function bcConn(code){const ch=new BroadcastChannel('th2-'+code),h={};const c={open:true,send:o=>ch.postMessage(o),on:(n,f)=>{h[n]=f;if(n==='open')setTimeout(f,30)}};ch.onmessage=e=>h.data&&h.data(e.data);return c}
function hostAs(role){me=role;isHost=true;mode='net';
  if(BC){$('codebox').hidden=false;$('codeShow').textContent='TEST';const c=bcConn('TEST');wire(c);c.on('data',o=>{if(o.t==='join'){c.send({t:'hello',hostRole:me});startNet()}else onMsg(o)});return}
  if(!window.Peer){$('codebox').hidden=false;$('cStatus').textContent='Online play could not load. Try one-phone mode.';return}
  const code=makeCode();$('codebox').hidden=false;$('codeShow').textContent=code;$('cStatus').textContent='Waiting for them to join…';
  try{peer&&peer.destroy()}catch(_){}peer=new Peer(PREFIX+code);
  peer.on('error',e=>{$('cStatus').textContent=e.type==='unavailable-id'?'That code is taken. Go back and try again.':'Network problem ('+e.type+'). Try again, or use one-phone mode.'});
  peer.on('connection',c=>{wire(c);c.on('open',()=>{c.send({t:'hello',hostRole:me});startNet()})})}
function joinRoom(){isHost=false;mode='net';
  if(BC){const c=bcConn('TEST');wire(c);c.send({t:'join'});return}
  const code=$('codeIn').value.trim().toUpperCase();if(code.length!==4){$('jStatus').textContent='The code has 4 characters.';return}
  if(!window.Peer){$('jStatus').textContent='Online play could not load. Try one-phone mode.';return}
  $('jStatus').textContent='Connecting…';try{peer&&peer.destroy()}catch(_){}peer=new Peer();
  peer.on('open',()=>{const c=peer.connect(PREFIX+code,{reliable:true});wire(c);const to=setTimeout(()=>{if(!c.open)$('jStatus').textContent='Can’t reach that room. Check the code, and keep their code screen open. Wi-Fi works best.'},10000);c.on('open',()=>{clearTimeout(to);$('jStatus').textContent='Connected!'})});
  peer.on('error',e=>{$('jStatus').textContent=e.type==='peer-unavailable'?'No room with that code. Check it with your other half.':'Network problem ('+e.type+'). Try again, or use one-phone mode.'})}
function startNet(){netStatus(true);show('game');$('who').innerHTML='You are <b style="color:'+COL[me]+';font-weight:500">'+(me==='her'?'Her':'Him')+'</b>';buildQuick();if(isHost)goStep(0)}

/* ================= main loop ================= */
function loop(t){const dt=Math.min(.05,(t-(lastT||t))/1000);lastT=t;shake*=Math.pow(.02,dt);
  cx.save();cx.fillStyle='#0a0808';cx.fillRect(0,0,540,780);if(shake>.3)cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  if(scene)drawScene(t);else if(view==='stage')drawStage(t,dt);else if(view==='mini')drawMini(t,dt);else if(view==='boss')drawBoss(t,dt);else if(view==='final')drawFinal(t);
  parts.forEach(p=>{p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=.98;const a=Math.max(0,1-p.age/p.life);cx.globalAlpha=a;cx.fillStyle=p.col;if(p.heart){heartPath(p.x,p.y-p.r*2,p.r*3.2);cx.fill()}else{cx.beginPath();cx.arc(p.x,p.y,p.r*a+.5,0,7);cx.fill()}});cx.globalAlpha=1;parts=parts.filter(p=>p.age<p.life);
  if(flashT&&t-flashT<350){cx.fillStyle=`rgba(255,143,134,${.22*(1-(t-flashT)/350)})`;cx.fillRect(0,0,540,780)}
  cx.restore();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

$('bCreate').onclick=()=>{$('codebox').hidden=true;show('create')};
$('asHer').onclick=()=>hostAs('her');$('asHim').onclick=()=>hostAs('him');
$('bJoin').onclick=()=>{$('jStatus').textContent='';show('join');setTimeout(()=>$('codeIn').focus(),50)};
$('bGo').onclick=joinRoom;$('codeIn').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom()});
$('bLocal').onclick=()=>{mode='local';isHost=true;show('game');$('who').textContent='One phone';$('net').textContent='';buildQuick();goStep(0)};

</script>
