<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Split · Escape for Two</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap">
<style>
:root{--paper:#f6ecdf;--silver:#a59c95;--gold:#e6c27a;--her:#efb8b1;--him:#9fd0e6;--line:#3a2a30;--display:"Cormorant Garamond",Georgia,serif;--body:"Jost","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#09070a;color:var(--paper);font-family:var(--body);font-weight:300;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{background:radial-gradient(ellipse 90% 40% at 50% -5%,rgba(230,194,122,.12),transparent 70%),#09070a}
.screen{max-width:480px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:100%}.screen[hidden]{display:none}
.caps{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);text-align:center}
h1{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(46px,14vw,64px);margin:4px 0 0;text-align:center;line-height:1}
p.sub{color:var(--silver);text-align:center;font-size:15px;line-height:1.5;margin:0 auto;max-width:34ch}
.btn{font:inherit;font-size:16px;padding:14px 18px;border-radius:999px;border:1px solid rgba(230,194,122,.3);background:rgba(25,18,22,.8);color:var(--paper);cursor:pointer;width:100%}
.btn.pri{background:linear-gradient(135deg,#f6e3c3,#e6c27a);color:#1a1014;border:0}.btn.her{background:linear-gradient(135deg,#f7cdc7,#e79c94);color:#1a1014;border:0}.btn.him{background:linear-gradient(135deg,#d6eef7,#9fd0e6);color:#0d1a20;border:0}
.btn:active{transform:scale(.97)}
input.code{font:500 28px var(--body);letter-spacing:.3em;text-align:center;text-transform:uppercase;padding:12px;border-radius:14px;border:1px solid var(--line);background:#140f12;color:var(--paper);width:100%}
.codebig{font:500 46px var(--body);letter-spacing:.25em;text-align:center;color:var(--gold)}
.status{text-align:center;color:var(--silver);font-size:14px;min-height:1.4em}
.levels{display:flex;flex-direction:column;gap:10px}
.lv{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(25,18,22,.75);cursor:pointer;text-align:left;color:var(--paper);font:inherit}
.lv b{font-family:var(--display);font-style:italic;font-weight:600;font-size:22px;display:block}.lv span{font-size:13px;color:var(--silver)}.lv i{font-style:normal;font:600 13px var(--body);color:var(--gold);min-width:22px}
.lv .tm{margin-left:auto;font-size:12px;color:#8fd19e}
#game{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:6px 8px 8px;gap:6px}#game[hidden]{display:none}
.top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--silver)}.top b{color:var(--paper);font-weight:500}.top .sp{flex:1}
.top button{font:inherit;font-size:12px;background:none;border:1px solid var(--line);color:var(--paper);border-radius:999px;padding:5px 10px}
.board{position:relative;flex:1;min-height:0;display:flex;justify-content:center}
#cv{height:100%;max-width:100%;aspect-ratio:540/900;border-radius:14px;touch-action:none;box-shadow:0 0 0 1px rgba(230,194,122,.25),0 14px 40px rgba(0,0,0,.6)}
.bar{display:flex;gap:6px}
.bar input{flex:1;font:inherit;font-size:15px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:#140f12;color:var(--paper);min-width:0}
.bar button{font:inherit;font-size:14px;border-radius:999px;border:1px solid var(--line);background:#1a1216;color:var(--paper);padding:0 12px}
#log{display:flex;flex-direction:column;gap:3px;max-height:68px;overflow:auto;font-size:13px}
#log div{padding:2px 10px;border-radius:10px;max-width:85%}#log .her{align-self:flex-start;background:rgba(239,184,177,.15);color:var(--her)}#log .him{align-self:flex-end;background:rgba(159,208,230,.15);color:var(--him)}#log .sys{align-self:center;color:var(--silver);font-size:12px}
.shake{animation:sh .45s}@keyframes sh{20%{transform:translate(-8px,2px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,2px)}80%{transform:translate(3px,-1px)}}
</style></head><body>
<section class="screen" id="home"><div class="caps" style="margin-top:28px">An escape game for two</div><h1>Split</h1>
<p class="sub">Five rooms, each split down the middle. You can only touch your half. The answer to your lock is always on the other side.</p>
<div style="height:8px"></div><button class="btn pri" id="bCreate">Create a room</button><button class="btn" id="bJoin">Join a room</button><button class="btn" id="bLocal">Test on one phone</button></section>
<section class="screen" id="create" hidden><div class="caps" style="margin-top:28px">Your room</div><p class="sub">Which half are you?</p>
<button class="btn her" id="asHer">I’m Her · top half</button><button class="btn him" id="asHim">I’m Him · bottom half</button><div class="codebig" id="code"></div><div class="status" id="cStatus"></div><button class="btn" data-back>Back</button></section>
<section class="screen" id="join" hidden><div class="caps" style="margin-top:28px">Join</div><p class="sub">Type the code from your other half’s phone.</p><input class="code" id="jCode" maxlength="4" autocomplete="off"><button class="btn pri" id="bGo">Join</button><div class="status" id="jStatus"></div><button class="btn" data-back>Back</button></section>
<section class="screen" id="pick" hidden><div class="caps" style="margin-top:22px">Choose a room</div><p class="sub" id="pickSub"></p><div class="levels" id="levels"></div></section>
<section id="game" hidden><div class="top"><button id="bMenu">‹ Rooms</button><b id="lvName"></b><span class="sp"></span><span id="clock">0:00</span><button id="bHint">Hint</button><button id="bKnock">Knock</button></div>
<div class="board"><canvas id="cv" width="540" height="900"></canvas></div><div id="log"></div>
<form class="bar" id="chatF"><input id="chatI" placeholder="Tell your other half what you see…" autocomplete="off" maxlength="140"><button>Send</button></form></section>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=i=>document.getElementById(i),cv=$('cv'),cx=cv.getContext('2d'),W=540,H=900,HH=450;
let mode=null,me='her',isHost=true,conn=null,peer=null,S=null,LVi=-1,view='menu',lastSent=0,modal=null,shakeT=0,flash=null;
const done=(()=>{try{return JSON.parse(localStorage.getItem('split_done')||'{}')}catch(_){return{}}})();
const GOLD='#e6c27a',PAPER='#f6ecdf',HER='#efb8b1',HIM='#9fd0e6';
const show=id=>['home','create','join','pick'].forEach(s=>$(s).hidden=s!==id);
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>show('home'));
/* ---------- tiny audio ---------- */
let AC=null;const tone=(f,d=.12,ty='sine',v=.15)=>{try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(_){}};
const sfx={ok:()=>{tone(660,.12);setTimeout(()=>tone(880,.18),90)},bad:()=>tone(160,.2,'square',.08),click:()=>tone(1200,.04,'triangle',.06),open:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.3),i*110))},knock:()=>{tone(110,.08,'square',.2);setTimeout(()=>tone(110,.08,'square',.2),140)}};
const buzz=n=>{try{navigator.vibrate&&navigator.vibrate(n)}catch(_){}};
/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r,fill,stroke){cx.beginPath();cx.roundRect(x,y,w,h,r);if(fill){cx.fillStyle=fill;cx.fill()}if(stroke){cx.strokeStyle=stroke;cx.lineWidth=2;cx.stroke()}}
function grad(y0,y1,a,b){const g=cx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,a);g.addColorStop(1,b);return g}
function txt(s,x,y,sz=14,col=PAPER,w=500,al='center',font='Jost'){cx.fillStyle=col;cx.font=(font==='C'?`italic ${w} ${sz}px "Cormorant Garamond", serif`:`${w} ${sz}px Jost, sans-serif`);cx.textAlign=al;cx.textBaseline='middle';cx.fillText(s,x,y)}
function glow(x,y,r,col,a=.5){const g=cx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');cx.save();cx.globalAlpha=a;cx.fillStyle=g;cx.fillRect(x-r,y-r,r*2,r*2);cx.restore()}
function room(y0,wallA,wallB,floor,lineCol){cx.fillStyle=grad(y0,y0+300,wallA,wallB);cx.fillRect(0,y0,W,300);cx.fillStyle=floor;cx.fillRect(0,y0+300,W,150);cx.fillStyle=lineCol;cx.fillRect(0,y0+300,W,3);for(let i=0;i<9;i++){cx.fillStyle='rgba(255,255,255,.03)';cx.fillRect(i*60,y0+303,2,147)}}
function frameP(x,y,w,h,col=GOLD){rr(x-6,y-6,w+12,h+12,4,'#2a1d14');rr(x-6,y-6,w+12,h+12,4,null,col)}
function hint(s){S&&(S.note={s,t:performance.now()})}
const own=r=>mode==='local'||r===me;
/* the partner's half: dim, and their small print is hidden */
const vis=r=>own(r);
const hide=(r,s)=>vis(r)?s:'···';
/* ---------- LEVELS ---------- */
const L=[];
/* 1 · TWO SIDES OF THE SAME ROOM: her = 1925, him = today */
L.push({name:'Two Sides',sub:'Same room. She’s in 1925, he’s in today.',top:'1925',bot:'TODAY',
 init:()=>({st:0,inv:{her:null,him:null},books:[],drawer:0,tree:0,chest:0,door:0}),
 hints:[['He: look closely at the old desk. Something is carved into it.','She: her drawer has a 3-digit lock.','The carving reads 3 1 4.'],
  ['She has a seed now. There’s an empty pot in 1925.','Plant it. Then he should look at today’s room.','Trees grow in 100 years. Check what’s hanging on it.'],
  ['He has a key. Today’s room has a chest.','The photo inside shows the old bookcase.','Pull the books in the order of the photo: red, blue, gold.'],
  ['Both of you: hold the door handle at the same time.','Count down in chat: 3, 2, 1, hold.','Keep holding until it opens.']],
 hot(S){const h=[];if(S.st===0)h.push({id:'drawer',r:'her',x:300,y:290,w:130,h:60,lock:{k:'digits',n:3},label:'locked drawer'});
  if(S.st===1&&S.inv.her==='seed')h.push({id:'pot',r:'her',x:60,y:290,w:90,h:90,label:'empty pot'});
  if(S.st===2&&S.inv.him!=='key')h.push({id:'treekey',r:'him',x:70,y:500,w:110,h:120,label:'the old tree'});
  if(S.st===2&&S.inv.him==='key')h.push({id:'chest',r:'him',x:300,y:770,w:150,h:80,label:'chest'});
  if(S.st===3)['red','blue','gold'].forEach((c,i)=>h.push({id:'book-'+c,r:'her',x:420+i*28,y:160,w:24,h:110,label:''}));
  if(S.st===4){h.push({id:'hold',r:'her',x:165,y:120,w:120,h:200,hold:1,label:'hold the handle'});h.push({id:'hold',r:'him',x:165,y:570,w:120,h:200,hold:1,label:'hold the handle'})}return h},
 act(S,r,id,v){if(id==='drawer'){if(v==='314'){S.st=1;S.inv.her='seed';return 'The drawer clicks open. A single seed inside.'}return 0}
  if(id==='pot'){S.inv.her=null;S.tree=1;S.st=2;return 'She plants the seed in 1925…'}
  if(id==='treekey'){S.inv.him='key';return 'A hundred years later, a key hangs from the tree.'}
  if(id==='chest'){S.inv.him=null;S.chest=1;S.st=3;return 'Inside: an old photo of the bookcase. Books pulled: red, blue, gold.'}
  if(id.startsWith('book-')){const c=id.slice(5);S.books.push(c);const want=['red','blue','gold'];for(let i=0;i<S.books.length;i++)if(S.books[i]!==want[i]){S.books=[];return -1}if(S.books.length===3){S.st=4;return 'Somewhere, a door unlocks. In both rooms.'}return 'click.'}},
 draw(S,t){/* 1925 */room(0,'#3b2a1c','#2a1d12','#4a3018','#6b4a28');cx.fillStyle='rgba(255,220,160,.06)';cx.fillRect(0,0,W,HH);
  frameP(320,40,120,110);cx.fillStyle='#5a4630';cx.fillRect(320,40,120,110);txt('1925',380,95,22,'#e9d3a8',500,'center','C');
  rr(300,250,140,110,6,'#5b3a1e');rr(300,290,130,60,4,S.st>0?'#2a1a0e':'#6d4626','#8a5a30');txt(S.st>0?'open':'🔒',365,320,14,'#e9d3a8');
  rr(60,330,90,60,10,'#7a4a2a');cx.fillStyle='#3a2414';cx.fillRect(66,320,78,14);if(S.tree){cx.fillStyle='#5fa35a';cx.beginPath();cx.ellipse(105,312,10,14,0,0,7);cx.fill()}
  rr(410,150,110,130,4,'#4a2e18');[['red','#b33a3a'],['blue','#3a5ab3'],['gold','#c9a24a'],['g','#3e5a3a'],['b','#6a4a2a']].forEach(([c,col],i)=>{const pulled=S.books.includes(c)||S.st>3&&i<3;cx.fillStyle=col;cx.fillRect(420+i*28+(pulled?0:0),pulled?150:165,22,pulled?120:105)});
  if(S.st>=4){glow(225,200,140,'rgba(255,220,150,.9)',.4)}
  rr(165,110,120,215,6,S.st>=4?'#2a1a10':'#3d2716','#8a5a30');cx.fillStyle=GOLD;cx.beginPath();cx.arc(268,220,7,0,7);cx.fill();
  /* today */room(HH,'#1e2a33','#141c22','#2a3038','#3a4a58');
  cx.fillStyle='#bcc6cc';cx.fillRect(318,488,124,100);txt('TODAY',380,538,16,'#1e2a33',600);
  rr(300,700,140,70,6,'#3a4048');txt(vis('him')?'carved: 3 1 4':'carved: ···',370,735,13,'#c9d3da',500);
  if(S.tree){cx.fillStyle='#4a3a2a';cx.fillRect(115,520,26,180);cx.fillStyle='#4f8a4c';cx.beginPath();cx.arc(128,520,70,0,7);cx.fill();cx.fillStyle='#62a35e';cx.beginPath();cx.arc(100,500,40,0,7);cx.arc(160,505,38,0,7);cx.fill();
    if(S.inv.him!=='key'&&S.st===2){cx.strokeStyle=GOLD;cx.lineWidth=2;cx.beginPath();cx.moveTo(150,560);cx.lineTo(150,585);cx.stroke();txt('🗝',150,596,20)}}
  else{cx.strokeStyle='#5a6670';cx.lineWidth=2;cx.beginPath();cx.moveTo(100,560);cx.lineTo(120,600);cx.lineTo(108,640);cx.stroke()}
  rr(300,780,150,70,8,S.chest?'#2a3038':'#5a4a3a','#8a7a6a');txt(S.chest?(vis('him')?'photo: red · blue · gold':'photo: ···'):'🔒 chest',375,815,13,'#e8e0d6',500);
  rr(165,560,120,215,6,S.st>=4?'#0f1418':'#2c363e','#4a5866');cx.fillStyle='#c9d3da';cx.beginPath();cx.arc(268,670,7,0,7);cx.fill();if(S.st>=4)glow(225,660,140,'rgba(180,220,255,.9)',.35)}});
/* 2 · THE MIRROR: his half is her room's reflection */
L.push({name:'The Mirror',sub:'His room is her reflection. Writing only reads one way.',top:'HER ROOM',bot:'THE REFLECTION',
 init:()=>({st:0,inv:{her:null,him:null},candle:0,arrows:''}),
 hints:[['Her wall has strange backwards writing.','He sees it in the reflection the right way round.','He reads her: 7 2 9.'],
  ['She has a candle now. Light it.','Lit, his reflection shows arrows on her wall.','In the mirror, up becomes down. Her arrows ↑ → → ↓ are ↓ → → ↑ for him.'],
  ['He has a key, but it only exists in the reflection.','He taps the mirror glass to pass it through.','She uses it on her door.'],
  ['Press your hands to the glass. Both at once.','Count down: 3, 2, 1.','Hold until it breaks.']],
 hot(S){const h=[];if(S.st===0)h.push({id:'safe',r:'her',x:330,y:300,w:120,h:90,lock:{k:'digits',n:3},label:'safe'});
  if(S.st===1)h.push({id:'candle',r:'her',x:80,y:300,w:70,h:90,label:'candle'});
  if(S.st===2)h.push({id:'arrows',r:'him',x:150,y:520,w:240,h:80,lock:{k:'arrows',n:4},label:'arrow lock'});
  if(S.st===3&&S.inv.him==='key')h.push({id:'glass',r:'him',x:0,y:450,w:540,h:60,label:'tap the glass'});
  if(S.st===3&&S.inv.her==='key')h.push({id:'door',r:'her',x:190,y:120,w:160,h:200,label:'door'});
  if(S.st===4){h.push({id:'hold',r:'her',x:170,y:360,w:200,h:80,hold:1});h.push({id:'hold',r:'him',x:170,y:460,w:200,h:80,hold:1})}return h},
 act(S,r,id,v){if(id==='safe'){if(v==='729'){S.st=1;S.inv.her='candle';return 'The safe opens. A candle inside.'}return 0}
  if(id==='candle'){S.candle=1;S.inv.her=null;S.st=2;return 'Candlelight. Something appears on the wall in the reflection.'}
  if(id==='arrows'){if(v==='↓→→↑'){S.st=3;S.inv.him='key';return 'The mirror-lock opens. A key, but only in the reflection.'}return 0}
  if(id==='glass'){S.inv.him=null;S.inv.her='key';return 'The key slides through the glass.'}
  if(id==='door'){S.inv.her=null;S.st=4;return 'The door opens… onto the mirror. Press the glass together.'}},
 draw(S,t){const drawRoom=(y0,flip,tint)=>{cx.save();if(flip){cx.translate(0,2*HH+0);cx.scale(1,-1);cx.translate(0,-HH)}
   room(0+(flip?HH:0)-(flip?HH:0),tint[0],tint[1],tint[2],tint[3]);
   rr(190,120,160,200,6,S.st>=4?'#120c14':'#3a2440','#8a6aa0');cx.fillStyle=GOLD;cx.beginPath();cx.arc(330,225,7,0,7);cx.fill();
   rr(330,300,120,90,6,S.st>0?'#1a1018':'#4a3550','#7a6090');
   rr(95,340,40,50,4,'#e8dcc8');if(S.candle){glow(115,325,90,'rgba(255,200,120,.9)',.6);cx.fillStyle='#ffd27a';cx.beginPath();cx.ellipse(115,330,5,10,0,0,7);cx.fill()}
   cx.restore()};
  drawRoom(0,0,['#2a1c33','#1c1224','#3a2440','#5a3a6a']);txt(S.st>0?'open':'🔒 safe',390,345,13);
  cx.save();cx.translate(270,70);cx.scale(-1,1);txt(vis('her')?'927':'···',0,0,34,'#d9c2e8',600);cx.restore();
  if(S.candle){const a=['↑','→','→','↓'];a.forEach((s,i)=>txt(s,40+i*30,240,26,'rgba(255,220,160,.35)',600))}
  /* reflection */cx.save();cx.beginPath();cx.rect(0,HH,W,HH);cx.clip();cx.translate(0,2*HH);cx.scale(1,-1);
   room(0,'#22283a','#161a28','#2a3048','#4a5a8a');rr(190,120,160,200,6,S.st>=4?'#0a0c14':'#28304a','#6a80b0');rr(330,300,120,90,6,'#2a3048','#5a6a90');rr(95,340,40,50,4,'#c8d0dc');if(S.candle)glow(115,325,90,'rgba(200,220,255,.9)',.5);cx.restore();
  txt(vis('him')?'729':'···',270,830,34,'#c2d4f0',600);
  if(S.candle){['↓','→','→','↑'].forEach((s,i)=>txt(s,40+i*30,660,26,vis('him')?'rgba(200,220,255,.85)':'rgba(200,220,255,.15)',600))}
  rr(150,520,240,80,10,S.st>=3?'#141a28':'#2a3a5a','#6a80b0');txt(S.st>=3?'open':'🔒 ↕ arrow lock',270,560,14,'#c2d4f0');
  if(S.inv.him==='key')txt('🗝  tap the glass to pass it',270,480,14,HIM);
  cx.fillStyle='rgba(255,255,255,.35)';cx.fillRect(0,HH-2,W,4);glow(270,HH,260,'rgba(220,230,255,.6)',.25);
  if(S.st>=4){txt('✋',230,410,40);txt('✋',310,490,40)}}});
/* 3 · UPSTAIRS / DOWNSTAIRS */
L.push({name:'Upstairs, Downstairs',sub:'Her flat is above his. Things fall through the floor.',top:'FLAT 2',bot:'FLAT 1',
 init:()=>({st:0,inv:{her:null,him:null},valves:'',water:0,cab:0,rope:0}),
 hints:[['Her wall has the building’s pipe plan.','His valves are unlabelled colours.','The plan says: turn green, then red, then blue.'],
  ['Her sink filled up. Something was at the bottom.','She has a ring. There’s a hole in her floor.','Drop it through. He catches it.'],
  ['The ring fits his cabinet.','Inside is a rope.','He throws it up to her.'],
  ['Pull the rope together. Both hold.','Count down in chat.','Hold until the chest comes up.']],
 hot(S){const h=[];if(S.st===0)['green','red','blue'].forEach((c,i)=>h.push({id:'v-'+c,r:'him',x:60+i*90,y:520,w:70,h:70,label:''}));
  if(S.st===1&&!S.inv.her&&!S.inv.him)h.push({id:'sink',r:'her',x:330,y:280,w:140,h:90,label:'sink'});
  if(S.st===1&&S.inv.her==='ring')h.push({id:'hole',r:'her',x:220,y:380,w:100,h:60,label:'hole'});

  if(S.won){const k=Math.min(1,(Date.now()-S.won)/700);cx.fillStyle=`rgba(9,7,10,${.85*k})`;cx.fillRect(0,0,W,H);cx.save();cx.globalAlpha=k;glow(W/2,380,260,'rgba(230,194,122,.9)',.4);txt('ESCAPED',W/2,330,13,GOLD,600);txt(lv.name,W/2,385,48,PAPER,500,'center','C');txt('Together in '+Math.floor(S.time/60)+':'+String(S.time%60).padStart(2,'0'),W/2,440,16,'#c9bfb6');
    if(isHost){rr(W/2-120,620,240,56,28,GOLD);txt('Next room ›',W/2,648,17,'#1a1014',600)}else txt('Waiting for your other half to pick the next room…',W/2,648,14,'#a59c95');cx.restore();
    if(!done[LVi]||done[LVi]>S.time){done[LVi]=S.time;try{localStorage.setItem('split_done',JSON.stringify(done))}catch(_){}}if(!S.fx){S.fx=1;sfx.open();buzz([80,60,160])}}
  const el=Math.floor(((S.won||Date.now())-S.t0)/1000);$('clock').textContent=Math.floor(el/60)+':'+String(el%60).padStart(2,'0')}
requestAnimationFrame(frame);
function resize(){}
/* ---------- chat, hint, knock ---------- */
function addLog(r,m){const d=document.createElement('div');d.className=r;d.textContent=(r==='sys'?'':'')+m;$('log').appendChild(d);$('log').scrollTop=1e9}
$('chatF').onsubmit=e=>{e.preventDefault();const m=$('chatI').value.trim();if(!m)return;$('chatI').value='';const r=mode==='local'?'her':me;addLog(r,m);send({t:'c',r,m})};
$('bHint').onclick=()=>{if(!S||S.won)return;const H=L[LVi].hints[Math.min(S.st,L[LVi].hints.length-1)];const i=Math.min(S.hl||0,2);addLog('sys','Hint '+(i+1)+'/3: '+H[i]);S.hl=(S.hl||0)+1};
$('bKnock').onclick=()=>{send({t:'k'});addLog('sys','You knocked on the wall.');sfx.knock()};
$('bMenu').onclick=()=>{if(isHost){showPick();send({t:'menu'})}else addLog('sys','Only the host can change rooms.')};
/* ---------- lobby & net ---------- */
function showPick(){view='menu';$('game').hidden=true;show('pick');$('pickSub').textContent=mode==='local'?'Test mode: tap either half.':isHost?'You choose. Your other half follows.':'Your other half is choosing…';
  const el=$('levels');el.innerHTML='';L.forEach((l,i)=>{const b=document.createElement('button');b.className='lv';b.innerHTML=`<i>${i+1}</i><div><b>${l.name}</b><span>${l.sub}</span></div>${done[i]?`<span class="tm">✓ ${Math.floor(done[i]/60)}:${String(done[i]%60).padStart(2,'0')}</span>`:''}`;
    b.onclick=()=>{if(!isHost)return;startLevel(i);if(mode==='net')send({t:'go',lv:i,S})};el.appendChild(b)})}
$('bLocal').onclick=()=>{mode='local';isHost=true;showPick()};
$('bCreate').onclick=()=>show('create');$('bJoin').onclick=()=>{show('join');$('jCode').focus()};
const PREFIX='split-esc-';let code='';
function wire(c){conn=c;c.on('data',onMsg);c.on('close',()=>addLog('sys','Your other half disconnected.'))}
function bcConn(code){const ch=new BroadcastChannel('split-'+code),h={};const c={open:true,send:o=>ch.postMessage(o),on:(n,f)=>{h[n]=f;if(n==='open')setTimeout(f,30)}};ch.onmessage=e=>h.data&&h.data(e.data);return c}
function host(r){me=r;mode='net';isHost=true;code=Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join('');if(location.search.includes('bc'))code='TEST';$('code').textContent=code;$('cStatus').textContent='Share this code. Waiting…';
  if(location.search.includes('bc')){const c=bcConn(code);wire(c);c.on('data',o=>{onMsg(o);if(o.t==='join'){c.send({t:'hello',hostRole:me});showPick()}});return}
  try{peer&&peer.destroy()}catch(_){}peer=new Peer(PREFIX+code);peer.on('error',e=>$('cStatus').textContent='Network problem ('+e.type+'). Try again.');
  peer.on('connection',c=>{wire(c);c.on('open',()=>{c.send({t:'hello',hostRole:me});showPick()})})}
$('asHer').onclick=()=>host('her');$('asHim').onclick=()=>host('him');
$('bGo').onclick=()=>{const c0=$('jCode').value.trim().toUpperCase();if(c0.length!==4){$('jStatus').textContent='Codes are 4 characters.';return}mode='net';isHost=false;
  if(location.search.includes('bc')){const c=bcConn(c0);wire(c);setTimeout(()=>c.send({t:'join'}),60);return}
  $('jStatus').textContent='Connecting…';try{peer&&peer.destroy()}catch(_){}peer=new Peer();peer.on('open',()=>{const c=peer.connect(PREFIX+c0,{reliable:true});wire(c)});peer.on('error',e=>$('jStatus').textContent=e.type==='peer-unavailable'?'No room with that code.':'Network problem ('+e.type+').')};
</script></body></html>
