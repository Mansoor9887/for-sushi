<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Until April</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--paper:#f6ecdf;--silver:#a59c95;--gold:#e6c27a;--her:#efb8b1;--line:#3a2530;--display:"Cormorant Garamond",Georgia,serif;--body:"Jost","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse 90% 45% at 50% -8%,rgba(239,184,177,.16),transparent 70%),radial-gradient(ellipse 80% 40% at 50% 108%,rgba(230,194,122,.12),transparent 70%),#0b0709 fixed;color:var(--paper);font-family:var(--body);font-weight:300;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding:22px 16px 40px;display:flex;flex-direction:column;gap:18px}
.caps{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);text-align:center}
.big{font-family:var(--display);font-weight:500;font-size:96px;line-height:.9;text-align:center;margin:4px 0 0;text-shadow:0 0 40px rgba(239,184,177,.35)}
.under{font-family:var(--display);font-style:italic;font-size:22px;text-align:center;color:var(--silver);margin:0}
.orn{width:120px;height:9px;margin:0 auto;background:linear-gradient(var(--gold),var(--gold)) 0 4px/52px 1px no-repeat,linear-gradient(var(--gold),var(--gold)) 68px 4px/52px 1px no-repeat,linear-gradient(45deg,transparent 35%,var(--gold) 35% 65%,transparent 65%) 55px 0/10px 9px no-repeat}
.env{position:relative;aspect-ratio:1.45;border-radius:14px;cursor:pointer;perspective:900px;margin-top:70px}
.env .back{position:absolute;inset:0;border-radius:14px;background:linear-gradient(160deg,#3a1d2c,#24121c);border:1px solid rgba(230,194,122,.35);box-shadow:0 20px 50px rgba(0,0,0,.6)}
.env .flap{position:absolute;left:0;right:0;top:0;height:58%;transform-origin:top;transition:transform .9s cubic-bezier(.3,.8,.3,1);z-index:3}
.env .flap::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#4a2638,#33182a);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:14px 14px 0 0}
.env .seal{position:absolute;left:50%;top:58%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f7d98f,#b8892e);box-shadow:0 4px 14px rgba(0,0,0,.5);z-index:4;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-size:22px;color:#4a2a10;transition:opacity .4s}
.env .pocket{position:absolute;inset:0;border-radius:14px;z-index:2;background:linear-gradient(200deg,transparent 49.5%,#2c1622 50%),linear-gradient(160deg,transparent 49.5%,#2c1622 50%);background-size:100% 100%;pointer-events:none}
.env .card{opacity:0;position:absolute;left:7%;right:7%;top:9%;bottom:9%;border-radius:8px;background:#fbf4ea;color:#2a1520;z-index:1;padding:18px 20px;display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:center;transition:transform .9s .35s cubic-bezier(.2,.8,.2,1)}
.env .card small{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#b8344d}
.env .card p{margin:0;font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(19px,5.4vw,23px);line-height:1.28}
.env.open .flap{transform:rotateX(180deg);z-index:0}.env.open .seal{opacity:0}.env.open .card{opacity:1;transform:translateY(-34%);z-index:5;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.env.open{margin-bottom:22%}
.hint{text-align:center;font-size:13px;color:var(--silver);margin:0}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid button{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:#140c11;color:#5a4a50;font:500 11px var(--body);padding:0;cursor:default}
.grid button.past{background:#2a1520;color:var(--her);border-color:rgba(239,184,177,.3);cursor:pointer}
.grid button.today{background:var(--gold);color:#2a1520;border-color:var(--gold);cursor:pointer;box-shadow:0 0 14px rgba(230,194,122,.5)}
.grid button.wed{border-color:var(--gold);color:var(--gold)}
.mon{grid-column:1/-1;font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--silver);margin:8px 0 0}
#peek{position:fixed;inset:0;background:rgba(11,7,9,.92);display:none;align-items:center;justify-content:center;padding:24px;z-index:9}
#peek.show{display:flex}#peek div{background:#fbf4ea;color:#2a1520;border-radius:10px;padding:24px 22px;max-width:380px;text-align:center}
#peek small{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#b8344d;display:block;margin-bottom:8px}
#peek p{margin:0;font-family:var(--display);font-style:italic;font-size:22px;line-height:1.3}
</style></head><body><div class="wrap">
<div class="caps">Until the 2nd of April</div>
<div class="big" id="n">–</div><p class="under" id="u">days</p><div class="orn"></div>
<div class="env" id="env"><div class="back"></div><div class="card"><small id="lab"></small><p id="txt"></p></div><div class="pocket"></div><div class="flap"></div><div class="seal">S</div></div>
<p class="hint" id="hint">Tap to open today’s</p>
<div class="grid" id="grid"></div>
</div><div id="peek"><div><small id="pl"></small><p id="pt"></p></div></div>
<script>
const L=[["Today", "Today. Two halves. Qubool hai, again, and every day after ♥️"], ["Tomorrow", "Tomorrow. Sleep, Sushi. I’ll see you at the start of everything."], ["2 days", "Two. I’m not nervous. (I’m a little nervous.)"], ["3 days", "Three. Mehndi on your hands soon. Hide my name well, I’m going to find it."], ["4 days", "Four. I’ve reread our chats from the start. We really said all that."], ["5 days", "Five. Whatever goes wrong with the arrangements, we laugh about it later. Promise?"], ["6 days", "Six. Sleep properly this week. I need you rested, you never rest."], ["One week", "One week. This time next week you’ll be tired, beautiful, and mine in front of everybody."], ["8 days", "Eight. Tell me one thing you want me to say to you on the day. I’ll say it."], ["9 days", "Nine days. Start packing the things you can’t live without. I’m one of them, I’m already in Riyadh."], ["The 23rd", "23 March. One year since the ring. In ten days I get to do it properly, in front of everyone."], ["A memory", "“Kia laraiyan thi.” And look at us now."], ["A note", "Today’s plan: miss you. Already on schedule."], ["A memory", "The night you asked ChatGPT to decode my messages. I still laugh."], ["A dare", "Dare: call me by a new name all day today."], ["A dare", "Dare: tell me the first thing you want to do in Riyadh."], ["A memory", "The bicep heart. We looked ridiculous. I’d do it again tomorrow."], ["A reason", "You. Just you. No list needed today."], ["A promise", "I promise that “no ego” stays the first rule."], ["A question", "What should I know about you on your bad days?"], ["A dare", "Dare: hum our song. Ten seconds. I won’t save it. (I will save it.)"], ["A reason", "With you, even the laraiyan ended up making us closer."], ["A memory", "The candles, the chocolates, the flowers in October. “10/10 full romantic.” Best review of my life."], ["A promise", "I promise to pray for us more than I plan for us."], ["A question", "What are you most looking forward to after April? Second most?"], ["A dare", "Dare: write me a two-line note by hand. Photo, please."], ["A reason", "You’re my calm. Just thinking of you as my wife settles my heart."], ["A note", "Slow day today. Blanket, something warm, and no pressure about anything. I’ve got the rest."], ["A note", "Whatever you’re wearing today, you look good. I checked."], ["A promise", "I promise to keep our lucky number lucky."], ["A question", "What does “home” mean to you, in one line?"], ["A memory", "Your back hurting after the nikah because you never rested. Next time, I’m making you sit."], ["A dare", "Dare: choose what I’m eating tonight. I’ll send proof."], ["A reason", "You believed in “us” before I knew how to say it."], ["A promise", "I promise to laugh at your jokes. Even the bad ones. Especially those."], ["A question", "What’s one small thing that would make your week easier right now?"], ["A reason", "The way you say “us”."], ["A dare", "Dare: tell me one thing you’re scared of about moving. I’ll answer honestly."], ["The 23rd", "The 23rd. Five months married. Next month on this date it’s one year since the ring."], ["A memory", "23 September. Qubool hai. Three times, and I meant each one more than the last."], ["A reason", "You make me want to be home early, and I don’t even live with you yet."], ["A reason", "Your heart is loud even when your messages are short."], ["A promise", "I promise space when you need it, and to be right there when you’re done."], ["One year", "18 February. A year ago tonight you said “Salam”. One word, and here we are."], ["A question", "Where should the first painting hang?"], ["A dare", "Dare: type out one line from the nikah day you want to remember forever."], ["A reason", "You ask “what do you like?” like it’s important. It became important because you asked."], ["14 February", "I don’t need a day for this. But since the world insists: you’re my Valentine for every year I get."], ["A memory", "The first time you said it back."], ["A promise", "I promise to check on you when you’re not well. It takes two seconds. I know now."], ["A question", "What do you want me to say more often?"], ["A dare", "Dare: send me a selfie with the most serious face you can make."], ["A reason", "Aap ne meri saari deewarein gira di, aur pata bhi nahi chalne diya."], ["A note", "Go drink water. I love you."], ["A promise", "I promise to keep sending you flowers after it stops being a surprise."], ["A note", "Today you’re excused from everything, including replying fast. Chocolate helps. So do I, a little, I hope."], ["A question", "What’s your favourite thing I’ve ever said to you?"], ["A memory", "11 September, 3:37 AM. I stopped hinting."], ["A dare", "Dare: pick our first movie night film. No changing it later."], ["A reason", "You let me be reserved until I wasn’t scared anymore."], ["A promise", "I promise to never make you ask twice for my time."], ["A question", "What should our rule be for when we’re both angry?"], ["A reason", "How excited you get about food. Never lose that."], ["A dare", "Dare: tell me the exact moment you knew."], ["A memory", "The croissant. Nobody else will ever understand, and that’s the point."], ["A reason", "You trust me. I don’t take that lightly, ever."], ["A reason", "You are soft with me and stubborn for me."], ["A promise", "I promise to make Riyadh feel like yours, not just mine."], ["A question", "What’s one thing about you I still don’t know?"], ["The 23rd", "The 23rd again. Four months. I’m getting used to calling you my wife, and I never want to get fully used to it."], ["A dare", "Dare: order dessert today. I’ll pay. Send proof."], ["A reason", "You wanted to paint a portrait of us and worried where to hide it. I think about that a lot."], ["A memory", "The time I sent you a formal leave request: “Dear Suhaira, hope you are in good health…”"], ["A promise", "I promise to learn how you like to be loved, and keep learning."], ["A question", "What did you think of me on 18 February? Honestly."], ["A dare", "Dare: one voice note, ten seconds, just you saying good morning."], ["A reason", "You make ordinary days worth reporting to someone."], ["A note", "Halfway through the week. Proud of you for nothing in particular."], ["A promise", "I promise a date night, even when work says no."], ["A question", "What’s the first meal you want to cook in our kitchen? (Or the first one I should.)"], ["A memory", "The heart-shaped box in August. You said I remembered what you like. I always will."], ["A dare", "Dare: tell me which of my habits you’re going to fix after April."], ["A reason", "Your patience with a man who works on things “at the backend” and forgets to say so."], ["A note", "Easy day today. No dares, no questions. Just be gentle with yourself, and tell me if you need anything."], ["A promise", "I promise to take your side in the room, and discuss it later at home."], ["A question", "Which fight are you secretly glad we had?"], ["A reason", "You said sorry first that night. I haven’t forgotten how big that was."], ["A dare", "Dare: send me the last photo in your gallery. Whatever it is."], ["A memory", "“Jab ap paint krtay ho it feels like saari problems khatam.” I want that feeling for you every week."], ["A reason", "You keep dried flowers as memories. I’m marrying a girl who keeps things."], ["A reason", "The way you loved a box of flowers like it was the whole garden."], ["New year", "New year. The first one that starts with a wife. Every resolution I have this year has your name in it."], ["A promise", "I promise our fights stay between us."], ["A question", "What do you want our mornings to smell like?"], ["A dare", "Dare: bicep heart, round two. You first."], ["A reason", "You notice when my replies get short, and you ask instead of assuming."], ["A memory", "July. You painted the shells from the beach and sent me the picture at midnight."], ["A promise", "I promise to tell you first. Good news, bad news, boring news."], ["A question", "When did you last miss me the most?"], ["A dare", "Dare: write my name the fanciest way you can and send a photo."], ["100 days", "One hundred days. And it’s the 23rd. Three months of you being my wife on paper, and a hundred days till the whole world sees it."], ["A reason", "You remember what I said three weeks ago better than I do."], ["A note", "If today was hard, tell me. If it was good, tell me faster."], ["A promise", "I promise to keep choosing pyaar over ghussa. Most days on the first try."], ["A question", "What’s one thing you want us to always do on the 23rd?"], ["A memory", "The mandi photo. You know the one."], ["A dare", "Dare: paint something tiny today, even on a tissue, and send it."], ["A reason", "You fight for us, not against me. There’s a difference and you taught me it."], ["A promise", "I promise chai when you’re tired, without you asking."], ["A question", "What should I never stop doing after we’re married?"], ["A reason", "Your “goodnight love”. My day isn’t closed until it arrives."], ["A note", "Nothing to do today. Rest, eat something sweet, and let me do the worrying. Dessert is on me 🍫"], ["A dare", "Dare: send me your current wallpaper."], ["A memory", "The day I flew back to Riyadh and realised I was leaving something behind."], ["A reason", "You make Riyadh feel less far from home, from 3,000 km away."], ["A reason", "How you say thank you for small things like they’re big things."], ["A promise", "I promise to ask, not assume."], ["A question", "What does a perfect ordinary Tuesday with me look like?"], ["A dare", "Dare: describe me in three emojis. I’ll do you."], ["A reason", "You stayed through every one of my “seen”s."], ["A memory", "23 March. A ring, and you pretending not to be nervous."], ["A promise", "I promise we never sleep on a fight if one “sorry” can end it."], ["A question", "What’s a non-negotiable for our home?"], ["A dare", "Dare: tell me one thing you’ve never told me. Small is fine."], ["A reason", "You painted again after years, and told me first."], ["A note", "No task today. Just know someone in Riyadh is thinking about you."], ["A promise", "I promise your paintings get the best wall in the house."], ["A question", "What’s one thing I did this week that you liked and didn’t mention?"], ["A memory", "The dates box. A small thing that I still think about."], ["A dare", "Dare: send me a picture of what you’re looking at right now. No fixing it first."], ["The 23rd", "It’s the 23rd. Two months since “qubool hai”. Still the best thing I’ve ever said out loud."], ["A reason", "You turned a rishta into my favourite person to talk to."], ["A promise", "I promise to say “I’m working on it” instead of going quiet."], ["A question", "What’s in your heart today, for me?"], ["A reason", "You say it when you’re hurt. You have no idea how much easier that makes loving you right."], ["A dare", "Dare: send me one line of a song. Typed doesn’t count. Voice note."], ["A memory", "18 February. You said “Salam” and I had no idea what had just walked into my life."], ["A reason", "The way you type “yaarrr” when I’ve annoyed you. I’d annoy you again just to read it."], ["Start", "Sushi, one line from me every morning until the 2nd of April. Some sweet, some silly, some dares. Open them only one day at a time. No cheating 😌"]],WED=Date.UTC(2027,3,2);
/* the day turns over at midnight Karachi time (UTC+5) */
const today=()=>{const n=new Date(Date.now()+5*3600e3);return Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate())};
const left=Math.round((WED-today())/864e5),k=Math.max(0,Math.min(138,left)),$=i=>document.getElementById(i);
$('n').textContent=Math.max(0,left);$('u').textContent=left<=0?'today':left===1?'day':'days';
const [lab,txt]=L[k];$('lab').textContent=lab;$('txt').textContent=txt;
let opened=false;try{opened=localStorage.getItem('ua_'+k)==='1'}catch(_){}
const env=$('env');if(opened){env.classList.add('open');$('hint').textContent='Come back tomorrow for the next one ♥️'}
env.onclick=()=>{if(env.classList.contains('open'))return;env.classList.add('open');try{localStorage.setItem('ua_'+k,'1')}catch(_){}if(navigator.vibrate)navigator.vibrate(20);$('hint').textContent='Come back tomorrow for the next one ♥️'};
const g=$('grid'),MN=['January','February','March','April','May','June','July','August','September','October','November','December'];let lm=-1;
for(let n=138;n>=0;n--){const d=new Date(WED-n*864e5),m=d.getUTCMonth();if(m!==lm){lm=m;const h=document.createElement('div');h.className='mon';h.textContent=MN[m]+' '+d.getUTCFullYear();g.appendChild(h);for(let i=0;i<(d.getUTCDay()+6)%7;i++)g.appendChild(document.createElement('span'))}
  const b=document.createElement('button');b.textContent=d.getUTCDate();if(n===0)b.classList.add('wed');
  if(n>k){b.classList.add('past');b.onclick=()=>{$('pl').textContent=L[n][0];$('pt').textContent=L[n][1];$('peek').classList.add('show')}}
  else if(n===k){b.classList.add('today');b.onclick=()=>{env.scrollIntoView({behavior:'smooth',block:'center'});env.click()}}
  else b.title='Not yet 😌';g.appendChild(b)}
$('peek').onclick=()=>$('peek').classList.remove('show');
</script></body></html>
