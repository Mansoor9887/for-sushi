<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d0b0b">
<title>Two Halves</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: one heart-shaped stage that the whole game happens inside; HUD above, hint line below. Single dark look on purpose. */
:root{
  --ink:#0d0b0b; --stage:#070606; --paper:#f1e9e0; --silver:#a59c95; --blush:#efb8b1; --rose:#d9837c; --line:#2b2624;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--paper);height:100%}
body{font-family:var(--body);font-weight:300;padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lv{display:flex;gap:8px}
.lv svg{width:20px;height:18px}
.lv path{fill:none;stroke:var(--line);stroke-width:1.6;transition:fill .5s,stroke .5s}
.lv .on path{fill:var(--blush);stroke:var(--blush)}
.lv .now path{stroke:var(--paper)}
.snd{background:none;border:1px solid var(--line);color:var(--silver);font:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:999px;padding:6px 12px;cursor:pointer}
.snd:focus-visible,.btn:focus-visible{outline:2px solid var(--blush);outline-offset:3px}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:4/5;background:radial-gradient(120% 90% at 50% 45%,#141010 0%,var(--stage) 70%);border-radius:8px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.09;mix-blend-mode:screen;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;background:rgba(7,6,6,.72);opacity:0;pointer-events:none;transition:opacity .5s;padding:0 24px}
.card.show{opacity:1}
.card .n{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--silver)}
.card .t{font-family:var(--display);font-style:italic;font-size:clamp(30px,8.5vw,46px);line-height:1.05;text-wrap:balance}
.card .s{font-size:14px;color:var(--silver);max-width:30ch;line-height:1.5}
.phrase{text-align:center;font-family:var(--display);font-style:italic;font-size:clamp(22px,6vw,30px);margin:0;line-height:1.2}.phrase span{color:var(--line);transition:color .8s,text-shadow .8s}.phrase span.on{color:var(--blush);text-shadow:0 0 14px rgba(239,184,177,.45)}
.hint{min-height:3.2em;text-align:center;font-size:15px;line-height:1.5;color:var(--silver);text-wrap:balance}
.hint b{color:var(--paper);font-weight:400}
.btn{align-self:center;font:inherit;font-size:15px;letter-spacing:.04em;padding:13px 26px;border-radius:999px;border:1px solid var(--paper);background:var(--paper);color:var(--ink);cursor:pointer}
.endrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn.ghost{background:transparent;color:var(--paper);border-color:var(--blush);text-decoration:none}.btn[hidden]{display:none}
.letter{display:flex;flex-direction:column;gap:18px;text-align:center;text-wrap:pretty;padding-block:28px 8px;margin-top:6px;border-top:1px solid var(--line);font-family:var(--display);font-style:italic;font-size:clamp(19px,5.1vw,22px);line-height:1.55;color:var(--paper);max-width:34ch;margin-inline:auto;position:relative}
.letter p{margin:0;opacity:0;transform:translateY(8px);transition:opacity 1.2s ease,transform 1.2s ease}.letter p.on{opacity:1;transform:none}
.letter .hl{color:var(--blush)}.letter .big{font-size:1.35em;line-height:1.2;display:block;text-wrap:balance}
.letter .close{display:block;font-size:1.12em;line-height:1.5;padding-top:6px}
.letter .orn{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:18px;height:18px;background:var(--ink);display:grid;place-items:center}
.letter .orn::before{content:"";width:8px;height:8px;background:var(--blush);transform:rotate(45deg);border-radius:1px}
.endheart{display:flex;justify-content:center;padding-top:4px}.endheart svg{width:30px;height:27px;fill:var(--blush);animation:beat 1.2s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(239,184,177,.6))}
.note{font-size:12px;color:var(--silver);border-top:1px solid var(--line);padding-top:12px;line-height:1.6}
text{font-family:var(--body)}
.serif{font-family:var(--display)}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.045)}24%{transform:scale(1)}36%{transform:scale(1.03)}}
.beating{animation:beat 1.1s ease-in-out infinite;transform-origin:200px 270px;transform-box:view-box}
.fast{animation-duration:.62s}
@media (prefers-reduced-motion:reduce){.beating{animation:none}}
</style>
<style>*{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

const sv=$('sv'),stage=$('stage'),L=$('L'),R=$('R'),H=$('H'),hint=$('hint'),kmT=$('km'),subT=$('sub');
const NS='http://www.w3.org/2000/svg',KM=2050,D0=150;
let d=D0,handler={},raf=0,sound=true,ac=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const fmt=n=>Math.max(0,Math.round(n)).toLocaleString('en-US');
function setD(v){d=v;L.setAttribute('transform',`translate(${-d} 0)`);R.setAttribute('transform',`translate(${d} 0)`);kmT.textContent=fmt(KM*d/D0)+' km';}
function animD(t,ms=700){const s=d,t0=performance.now();return new Promise(res=>{(function f(n){const k=Math.min(1,(n-t0)/ms);setD(s+(t-s)*ease(k));k<1?requestAnimationFrame(f):res()})(t0)})}
function fade(el,o,ms=600){el.style.transition=`opacity ${ms}ms`;el.setAttribute('opacity',o);el.style.opacity=o}
function pt(e){const p=sv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(sv.getScreenCTM().inverse())}
function setHint(h){hint.innerHTML=h}
function word(i){const w=$('phrase').children[i];if(w){w.classList.add('on');chime(990)}}
function words(n){[...$('phrase').children].forEach((w,i)=>w.classList.toggle('on',i<n))}

/* progress hearts */
const lv=$('lv');const HP='M10 17 C5 13 1 10 1 6 C1 3 3 1 5.5 1 C7.5 1 9 2.3 10 4 C11 2.3 12.5 1 14.5 1 C17 1 19 3 19 6 C19 10 15 13 10 17Z';
for(let i=0;i<6;i++){const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 20 18');s.innerHTML=`<path d="${HP}"/>`;lv.appendChild(s)}
function prog(i,done){[...lv.children].forEach((s,j)=>{s.classList.toggle('on',j<done);s.classList.toggle('now',j===i&&j>=done)})}

/* sound: a soft synthesized heartbeat */
function thump(v=.5){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime;[[0,62,v],[.17,52,v*.7]].forEach(([o,f,g])=>{const os=ac.createOscillator(),ga=ac.createGain();os.type='sine';os.frequency.setValueAtTime(f,t+o);os.frequency.exponentialRampToValueAtTime(f*.6,t+o+.16);ga.gain.setValueAtTime(0,t+o);ga.gain.linearRampToValueAtTime(g,t+o+.015);ga.gain.exponentialRampToValueAtTime(.001,t+o+.2);os.connect(ga).connect(ac.destination);os.start(t+o);os.stop(t+o+.22)})}catch(_){}}
function chime(f=880){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,os=ac.createOscillator(),ga=ac.createGain();os.type='triangle';os.frequency.value=f;ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(.08,t+.01);ga.gain.exponentialRampToValueAtTime(.001,t+.35);os.connect(ga).connect(ac.destination);os.start(t);os.stop(t+.4)}catch(_){}}
function click(heavy){if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,len=heavy?.09:.025,b=ac.createBuffer(1,Math.ceil(ac.sampleRate*len),ac.sampleRate),dd=b.getChannelData(0);
  for(let i=0;i<dd.length;i++){const k=i/dd.length;dd[i]=(Math.random()*2-1)*Math.pow(1-k,heavy?3:6)}
  const src=ac.createBufferSource();src.buffer=b;const f=ac.createBiquadFilter();f.type=heavy?'lowpass':'bandpass';f.frequency.value=heavy?700:3200+Math.random()*600;f.Q.value=heavy?.8:6;const g=ac.createGain();g.gain.value=heavy?.9:.55;src.connect(f).connect(g).connect(ac.destination);src.start(t);
  const o=ac.createOscillator(),og=ac.createGain();o.type=heavy?'triangle':'square';o.frequency.setValueAtTime(heavy?140:2100,t);o.frequency.exponentialRampToValueAtTime(heavy?70:1500,t+(heavy?.12:.015));og.gain.setValueAtTime(heavy?.35:.04,t);og.gain.exponentialRampToValueAtTime(.0005,t+(heavy?.14:.02));o.connect(og).connect(ac.destination);o.start(t);o.stop(t+.16)}catch(_){}}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(_){}};
$('snd').onclick=()=>{sound=!sound;$('snd').textContent=sound?'Sound on':'Sound off';$('snd').setAttribute('aria-pressed',sound)};

/* input routing */
stage.addEventListener('pointerdown',e=>{e.preventDefault();try{stage.setPointerCapture(e.pointerId)}catch(_){};handler.down&&handler.down(e)});
stage.addEventListener('pointermove',e=>handler.move&&handler.move(e));
['pointerup','pointercancel','lostpointercapture'].forEach(n=>stage.addEventListener(n,e=>handler.up&&handler.up(e)));
document.addEventListener('keydown',e=>{if(handler.key&&e.key.startsWith('Arrow')){e.preventDefault();handler.key(e);return}if(handler.key&&(e.key===' '||e.key==='Enter')&&!handler.down){e.preventDefault();handler.key(e);return}if(e.key===' '||e.key==='Enter'){if(e.target.tagName==='BUTTON'&&e.target!==stage)return;e.preventDefault();if(!e.repeat)handler.down&&handler.down(e)}});
document.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')handler.up&&handler.up(e)});
stage.addEventListener('contextmenu',e=>e.preventDefault());
stage.tabIndex=0;

async function card(n,t,s,ms=1900){$('cn').textContent=n;$('ct').textContent=t;$('cs').textContent=s;$('card').classList.add('show');await sleep(ms);$('card').classList.remove('show');await sleep(400)}

/* 0 — opening */
function intro(){setD(D0);H.classList.add('beating');
  $('cn').textContent='For you';$('ct').textContent='Two halves';$('cs').textContent='Six chapters. Each one wins you a word. Tap to begin.';$('card').classList.add('show');
  setHint('Every heart needs both halves.');
  return new Promise(res=>{handler={down:()=>{handler={};thump(.6);$('card').classList.remove('show');res()}}})}


/* Chapter 2 — the heist (crack the safe with our dates) */
function chSafe(){setHint('<b>Turn the dial</b> and rest on each number. Our engagement date, then our nikah date, as <b>DD.MM</b>.');
  const g=$('safe'),dial=$('dial'),num=$('dialNum'),slots=$('slots'),CODE=[23,3,23,9],N=40;
  dial.innerHTML='';for(let i=0;i<N;i++){const a=i*9,big=i%5===0,ln=document.createElementNS(NS,'line');const r1=big?96:102;
    ln.setAttribute('x1',200);ln.setAttribute('y1',262-r1);ln.setAttribute('x2',200);ln.setAttribute('y2',262-112);ln.setAttribute('stroke',big?'#f1e9e0':'#6b625c');ln.setAttribute('stroke-width',big?2:1);ln.setAttribute('transform',`rotate(${a} 200 262)`);dial.appendChild(ln);
    if(big){const t=document.createElementNS(NS,'text');t.textContent=String(i).padStart(2,'0');t.setAttribute('x',200);t.setAttribute('y',262-78);t.setAttribute('fill','#a59c95');t.setAttribute('font-size','11');t.setAttribute('text-anchor','middle');t.setAttribute('transform',`rotate(${a} 200 262)`);dial.appendChild(t)}}
  slots.innerHTML='';const SX=[112,156,244,288];CODE.forEach((c,i)=>{const t=document.createElementNS(NS,'text');t.setAttribute('x',SX[i]);t.setAttribute('y',418);t.setAttribute('fill','#6b625c');t.textContent=i%2?'MM':'DD';slots.appendChild(t)});
  [[134,'.'],[266,'.']].forEach(([x,c])=>{const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',418);t.setAttribute('fill','#6b625c');t.textContent=c;slots.appendChild(t)});
  [[134,'ENGAGEMENT'],[266,'NIKAH']].forEach(([x,c])=>{const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',442);t.setAttribute('fill','#a59c95');t.setAttribute('font-size','9');t.setAttribute('letter-spacing','2.4');t.setAttribute('font-family','Jost, sans-serif');t.textContent=c;slots.appendChild(t)});
  g.style.display='';fade(g,1,500);fade(kmT,0,300);fade(subT,0,300);
  let rot=0,stage_i=0,lastAng=null,stillSince=performance.now(),cur=0;
  const show=()=>{dial.setAttribute('transform',`rotate(${rot} 200 262)`);cur=((Math.round(-rot/9)%N)+N)%N;num.textContent=String(cur).padStart(2,'0')};
  show();
  return new Promise(res=>{
    const tickT=setInterval(()=>{if(stage_i>=CODE.length)return;if(cur===CODE[stage_i]&&performance.now()-stillSince>800){const t=slots.children[stage_i];t.textContent=String(CODE[stage_i]).padStart(2,'0');t.setAttribute('fill','#efb8b1');click(true);buzz(25);stage_i++;stillSince=performance.now()+99999;
      if(stage_i>=CODE.length){clearInterval(tickT);handler={};num.textContent='OPEN';
        setTimeout(()=>{fade(g,0,600);fade(kmT,1,600);fade(subT,1,600);setTimeout(()=>{g.style.display='none';res()},620)},900)}}},60);
    const ang=e=>{const q=pt(e);return Math.atan2(q.y-262,q.x-200)*180/Math.PI};
    handler={down:e=>{if(e.clientX===undefined)return;lastAng=ang(e)},move:e=>{if(lastAng===null)return;const a=ang(e);let da=a-lastAng;if(da>180)da-=360;if(da<-180)da+=360;lastAng=a;rot+=da;show();stillSince=performance.now();
        if(Math.abs(da)>0&&Math.round(-rot/9)!==Math.round(-(rot-da)/9))click(false)},up:()=>{lastAng=null},
      key:e=>{if(e.key==='ArrowLeft'){rot+=9;show();click(false);stillSince=performance.now()}if(e.key==='ArrowRight'){rot-=9;show();click(false);stillSince=performance.now()}}};
  })}

/* Chapter — my passion (connect the dots into a heart, without lifting) */
function chPassion(){setHint('<b>Draw your heart, the one you made with your arm.</b> Join 1 to 18 in one go. Lift your finger and it starts again.');
  const g=$('passion'),dd=$('ddots'),line=$('dline'),live=$('dlive'),heat=$('heat'),gh=$('ghost'),N=18,L0=gh.getTotalLength();
  g.style.display='';fade(g,1,500);fade(H,.3,500);
  // number the dots so the path zig-zags between the two lobes: harder to follow than a plain circle
  const order=[];for(let i=0;i<N;i++)order.push(i);
  const RAW=[[235,595],[212,540],[205,485],[215,435],[238,395],[278,440],[300,385],[355,362],[420,365],[475,392],[518,440],[555,495],[585,560],[545,592],[470,598],[400,600],[330,602],[275,600]];
  const pts=RAW.map(([x,y])=>({x:(x-397)*.83+200,y:(y-483)*.83+250}));
  dd.innerHTML='';pts.forEach((p,i)=>{const gg=document.createElementNS(NS,'g');gg.innerHTML=`<circle cx="${p.x}" cy="${p.y}" r="5" fill="#f1e9e0"/><text x="${p.x+(p.x<200?-12:12)}" y="${p.y+4}" fill="#a59c95" font-size="10" text-anchor="${p.x<200?'end':'start'}">${i+1}</text>`;dd.appendChild(gg)});
  let k=0,down=false,done=false;const path=[];
  const reset=msg=>{k=0;path.length=0;line.setAttribute('points','');live.setAttribute('opacity',0);[...dd.children].forEach(c=>{c.querySelector('circle').setAttribute('fill','#f1e9e0');c.querySelector('circle').setAttribute('r',5)});if(msg){setHint(msg);buzz(80)}};
  return new Promise(res=>{
    const hitDot=q=>{const p=pts[k];if(Math.hypot(q.x-p.x,q.y-p.y)<16){const c=dd.children[k].querySelector('circle');c.setAttribute('fill','#efb8b1');c.setAttribute('r',6.5);path.push(`${p.x},${p.y}`);line.setAttribute('points',path.join(' '));chime(520+k*28);k++;
        if(k===N){done=true;handler={};path.push(`${pts[0].x},${pts[0].y}`);line.setAttribute('points',path.join(' '));live.setAttribute('opacity',0);thump(.8);buzz(60);
          const poly=$('dline');poly.style.transition='stroke-width .6s';poly.setAttribute('fill','rgba(239,184,177,.35)');poly.setAttribute('stroke-width','4');fade(H,1,900);
          setTimeout(()=>{fade(g,0,700);setTimeout(()=>{g.style.display='none';$('dline').setAttribute('fill','none');$('dline').setAttribute('stroke-width','3');res()},720)},1600)}}};
    handler={down:e=>{if(e.clientX===undefined||done)return;const q=pt(e);down=true;if(k===0){const p=pts[0];if(Math.hypot(q.x-p.x,q.y-p.y)>=16){down=false;setHint('<b>Start at dot 1</b>, then keep your finger down all the way to 18.');return}}hitDot(q)},
      move:e=>{if(!down||done||e.clientX===undefined)return;const q=pt(e);if(k>0){const p=pts[k-1];live.setAttribute('x1',p.x);live.setAttribute('y1',p.y);live.setAttribute('x2',q.x);live.setAttribute('y2',q.y);live.setAttribute('opacity',1)}
        // touching a later dot out of order breaks it
        for(let j=k+1;j<N;j++){const p=pts[j];if(Math.hypot(q.x-p.x,q.y-p.y)<9){down=false;reset('Wrong dot. <b>Start again from 1.</b>');return}}
        hitDot(q)},
      up:()=>{if(!down||done)return;down=false;if(k>0)reset('You let go. <b>Start again from 1</b>, in one go.')}};
  })}

/* Chapter — dance with me (watch my steps, then repeat them) */
function chDance(){setHint('<b>Follow my footsteps.</b> Watch the routine on the floor, then dance it back: left, right, left, right.');
  const g=$('dance'),fl=$('floor'),msg=$('dmsg'),cnt=$('count');g.style.display='';fade(g,1,500);fade(H,.25,500);
  const pads=[[136,200,'#efb8b1',523],[264,200,'#d9837c',659],[136,328,'#f1e9e0',784],[264,328,'#c7a6d6',988]];
  const NAMES=['LEFT FOOT FORWARD','RIGHT FOOT FORWARD','LEFT FOOT BACK','RIGHT FOOT BACK'];
  const foot=(x,y,left)=>{const m=left?-1:1;return `<g transform="translate(${x} ${y}) scale(${m} 1)"><path d="M-6 30 C-16 28 -18 14 -15 2 C-12 -10 -14 -20 -6 -26 C2 -31 12 -24 12 -12 C12 0 6 10 8 20 C9 28 2 32 -6 30 Z"/><circle cx="-11" cy="-33" r="4.2"/><circle cx="-3" cy="-37" r="3.6"/><circle cx="4" cy="-37" r="3.2"/><circle cx="10" cy="-33" r="2.8"/><circle cx="14" cy="-27" r="2.4"/></g>`};
  fl.innerHTML='';pads.forEach(([x,y,c],i)=>{const gg=document.createElementNS(NS,'g');gg.innerHTML=`<rect x="${x-58}" y="${y-58}" width="116" height="116" rx="10" fill="#efb8b1" opacity=".08" stroke="#5a504b" stroke-width="1.2"/><g class="ft" fill="#a59c95" opacity=".45">${foot(x,y+4,i%2===0)}</g><text x="${x}" y="${y+50}" fill="#6b625c" font-size="8" letter-spacing="1.8" text-anchor="middle">${i<2?'FORWARD':'BACK'}</text>`;fl.appendChild(gg)});
  const flash=(i,ms,show)=>{const r=fl.children[i].querySelector('rect'),t=fl.children[i].querySelector('.ft');r.setAttribute('opacity',.7);t.setAttribute('opacity',1);t.setAttribute('fill','#0d0b0b');tone(pads[i][3]);if(show)msg.textContent=NAMES[i];setTimeout(()=>{r.setAttribute('opacity',.08);t.setAttribute('opacity',.45);t.setAttribute('fill','#a59c95')},ms)};
  const tone=f=>{if(!sound)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,o=ac.createOscillator(),ga=ac.createGain();o.type='sine';o.frequency.value=f;ga.gain.setValueAtTime(0,t);ga.gain.linearRampToValueAtTime(.12,t+.01);ga.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(ga).connect(ac.destination);o.start(t);o.stop(t+.42)}catch(_){}};
  const LENS=[4,5,6,7];let round=0,seq=[],idx=0,listening=false;cnt.textContent='';fade(cnt,1,300);
  return new Promise(res=>{
    async function play(){listening=false;msg.textContent='WATCH MY FEET';cnt.textContent='Round '+(round+1)+' of 4';await sleep(700);
      const on=Math.max(260,440-round*55),gap=Math.max(110,170-round*20);
      for(const i of seq){flash(i,on,true);await sleep(on+gap)}
      msg.textContent='YOUR TURN';idx=0;listening=true}
    function newSeq(){seq=[];const first=Math.random()<.5?0:1;for(let i=0;i<LENS[round];i++){const side=(first+i)%2;seq.push(side+(Math.random()<.5?0:2))}}
    handler={down:e=>{if(!listening||e.clientX===undefined)return;const q=pt(e);const i=pads.findIndex(([x,y])=>Math.abs(q.x-x)<58&&Math.abs(q.y-y)<58);if(i<0)return;
      flash(i,200);
      if(i===seq[idx]){idx++;if(idx===seq.length){listening=false;round++;thump(.6);buzz(30);
          H.animate([{transform:'rotate(0deg)'},{transform:'rotate(-5deg)'},{transform:'rotate(5deg)'},{transform:'rotate(0deg)'}],{duration:600});H.style.transformOrigin='200px 270px';H.style.transformBox='view-box';
          if(round>=LENS.length){handler={};msg.textContent='YOU KNOW ALL MY STEPS';fade(cnt,0,300);setTimeout(()=>{fade(g,0,600);fade(H,1,600);setTimeout(()=>{g.style.display='none';res()},620)},900)}
          else{msg.textContent='NICE. LONGER NOW.';setTimeout(()=>{newSeq();play()},700)}}}
      else{listening=false;buzz(120);msg.textContent='YOU STEPPED ON MY FOOT. AGAIN';setTimeout(play,900)}}};
    newSeq();play()})}

/* Chapter — finish the line (their own words, timed) */
function chQuiz(){setHint('<b>Finish the line.</b> Only you would know these. Be quick.');
  const g=$('quiz'),l1=$('qline'),l2=$('qline2'),bar=$('qbar'),opts=$('qopts'),msg=$('qmsg');g.style.display='';fade(g,1,500);fade(kmT,0,300);fade(subT,0,300);
  let Q=[
    ['Meri chai mein dubi hui…','',['biscuit','rusk','cake']],
    ['I will eat you and','this ____ both',['croissant','brownie','pizza']],
    ['Long drive, chai on the balcony,','rain, and ____ together',['pakoray','samosay','gol gappay']],
    ];
  const TIME=6000;let cur,t0,raf2,right=0;
  return new Promise(res=>{
    function ask(){cur=Q.shift();const [a,b,o]=cur;l1.textContent=a;l2.textContent=b;msg.textContent=right+' / 3';
      const sh=[...o].sort(()=>Math.random()-.5);opts.innerHTML='';
      sh.forEach((w,i)=>{const gg=document.createElementNS(NS,'g');gg.dataset.w=w;gg.innerHTML=`<rect x="90" y="${250+i*54}" width="220" height="42" rx="21" fill="#151212" stroke="#3a3331"/><text x="200" y="${276+i*54}" fill="#f1e9e0" font-size="16" text-anchor="middle">${w}</text>`;opts.appendChild(gg)});
      t0=performance.now();cancelAnimationFrame(raf2);(function f(t){const k=Math.min(1,(t-t0)/TIME);bar.setAttribute('width',260*(1-k));if(k>=1){wrong(null);return}raf2=requestAnimationFrame(f)})(t0)}
    function wrong(gg){cancelAnimationFrame(raf2);if(gg)gg.querySelector('rect').setAttribute('stroke','#8a4a44');msg.textContent=gg?'Wrong! Again later…':'Too slow! Again later…';buzz(80);Q.push(cur);handler={};setTimeout(()=>{handler=h;ask()},900)}
    const h={down:e=>{if(e.clientX===undefined)return;const q=pt(e);const gg=[...opts.children].find((c,i)=>q.x>90&&q.x<310&&q.y>250+i*54&&q.y<292+i*54);if(!gg)return;
      if(gg.dataset.w===cur[2][0]){cancelAnimationFrame(raf2);right++;gg.querySelector('rect').setAttribute('fill','#efb8b1');gg.querySelector('text').setAttribute('fill','#0d0b0b');chime(700+right*60);thump(.4);msg.textContent=right+' / 3';handler={};
        setTimeout(()=>{if(!Q.length){fade(g,0,500);fade(kmT,1,500);fade(subT,1,500);setTimeout(()=>{g.style.display='none';res()},520)}else{handler=h;ask()}},650)}
      else wrong(gg)}};
    handler=h;ask()})}

/* Chapter — don't let go (one finger on each half, slide them together) */
function chHold(){const touch=matchMedia('(pointer:coarse)').matches;
  setHint(touch?'<b>Put one finger on YOU and one on ME.</b> Slide us together. Don’t let go of either.':'<b>Hold YOU and drag it to ME.</b> Don’t let go.');
  const tg=$('htarget'),fL=$('fpL'),fR=$('fpR');tg.style.display='';fade(tg,1,400);
  const START=d;let dl=START,dr=START,ptrs={},done=false,joinedAt=0,last=performance.now();
  const draw=()=>{L.setAttribute('transform',`translate(${-dl} 0)`);R.setAttribute('transform',`translate(${dr} 0)`);
    fL.setAttribute('transform',`translate(${130-dl} 300)`);fR.setAttribute('transform',`translate(${270+dr} 300)`);kmT.textContent=fmt(KM*(dl+dr)/2/D0)+' km'};
  draw();
  return new Promise(res=>{
    handler={down:e=>{if(done||e.clientX===undefined)return;const q=pt(e);
        if(Math.hypot(q.x-(130-dl),q.y-300)<44&&!Object.values(ptrs).some(p=>p.side==='L'))ptrs[e.pointerId]={side:'L',x0:q.x,v0:dl,mouse:e.pointerType==='mouse'};
        else if(Math.hypot(q.x-(270+dr),q.y-300)<44&&!Object.values(ptrs).some(p=>p.side==='R'))ptrs[e.pointerId]={side:'R',x0:q.x,v0:dr,mouse:e.pointerType==='mouse'};
        fade($('whisper'),0,200)},
      move:e=>{const p=ptrs[e.pointerId];if(!p||done)return;const q=pt(e);
        if(p.side==='L'){dl=Math.max(0,Math.min(START,p.v0-(q.x-p.x0)));if(p.mouse)dr=dl}else{dr=Math.max(0,Math.min(START,p.v0+(q.x-p.x0)));if(p.mouse)dl=dr}draw()},
      up:e=>{if(done||!ptrs[e.pointerId])return;delete ptrs[e.pointerId];
        const snap=()=>{const a=dl,b=dr,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/500);dl=a+(START-a)*ease(k);dr=b+(START-b)*ease(k);draw();if(k<1)requestAnimationFrame(f)})(t0)};
        Object.keys(ptrs).forEach(k=>delete ptrs[k]);joinedAt=0;snap();fade($('whisper'),1,300);buzz(80)}};
    (function f(t){if(done)return;const held=Object.keys(ptrs).length,need=touch?2:1;
      if(dl<1.5&&dr<1.5&&held>=need){if(!joinedAt){joinedAt=t;thump(.6)}if(t-joinedAt>900){done=true;handler={};dl=dr=0;draw();setD(0);fade(tg,0,400);setTimeout(()=>tg.style.display='none',420);fade($('whisper'),0,300);res();return}}else joinedAt=0;
      requestAnimationFrame(f)})(last)})}

/* 5 — wanted: catch the heart thief */
function chWanted(){setHint('Everyone said I was the trouble. Turns out you’re the thief. <b>Tap the poster.</b>');
  const w=$('wanted'),th=$('thief'),bars=$('bars'),cnt=$('count'),NEED=7;
  w.style.display='';fade(w,1,600);fade(kmT,0,300);fade(subT,0,300);
  return new Promise(res=>{
    handler={down:()=>{handler={};fade(w,0,500);setTimeout(()=>{w.style.display='none'},520);fade(H,.18,500);chase()}};
    function chase(){setHint('<b>Catch the stolen heart.</b> Seven times. Good luck.');
      let got=0,pos={x:200,y:270},tgt={x:200,y:270},next=0,gap=230,last=performance.now(),start=last;
      th.style.display='';fade(th,1,300);cnt.textContent='0 / 7';fade(cnt,1,300);
      bars.innerHTML='';for(let i=0;i<NEED;i++){const r=document.createElementNS(NS,'rect');r.setAttribute('x',50+i*50);r.setAttribute('y',110);r.setAttribute('width',5);r.setAttribute('height',320);r.setAttribute('rx',2.5);r.setAttribute('fill','#a59c95');r.setAttribute('opacity','0');bars.appendChild(r)}
      fade(bars,1,10);
      handler={down:e=>{if(e.clientX===undefined)return;const q=pt(e);const rad=performance.now()-start>40000?34:26;
        if(Math.hypot(q.x-pos.x,q.y-pos.y)<rad){got++;thump(.6);chime(520+got*70);buzz(30);
          bars.children[got-1].animate([{opacity:0,transform:'translateY(-40px)'},{opacity:.85,transform:'translateY(0)'}],{duration:350,fill:'forwards'});
          th.animate([{opacity:1},{opacity:.3},{opacity:1}],{duration:260});cnt.textContent=got+' / 7';gap+=15;next=0;
          if(got>=NEED){handler={};cancelAnimationFrame(raf);tgt={x:200,y:262};
            const p0={...pos},t0=performance.now();(function g(t){const k=Math.min(1,(t-t0)/600);pos.x=p0.x+(200-p0.x)*ease(k);pos.y=p0.y+(262-p0.y)*ease(k);th.setAttribute('transform',`translate(${pos.x} ${pos.y}) scale(${1+1.6*ease(k)})`);if(k<1)requestAnimationFrame(g);else verdict()})(t0)}}}};
      (function f(t){const dt=Math.min(.05,(t-last)/1000);last=t;next-=dt*1000;
        if(next<=0){tgt={x:70+Math.random()*260,y:130+Math.random()*280};next=gap}
        const k=1-Math.pow(.0005,dt*(2.6-got*.05));pos.x+=(tgt.x-pos.x)*k;pos.y+=(tgt.y-pos.y)*k;
        th.setAttribute('transform',`translate(${pos.x} ${pos.y}) scale(1.35)`);raf=requestAnimationFrame(f)})(last)}
    async function verdict(){fade(cnt,0,300);const v=$('verdict');fade(v,1,10);v.animate([{opacity:0,transform:'scale(1.4)'},{opacity:1,transform:'scale(1)'}],{duration:420,easing:'cubic-bezier(.2,.8,.2,1)',fill:'forwards'});
      v.style.transformOrigin='200px 240px';v.style.transformBox='view-box';thump(.9);buzz(60);setHint('Guilty as charged.');
      await sleep(2800);v.getAnimations().forEach(a=>a.cancel());v.style.opacity=1;fade(v,0,600);fade(kmT,1,600);fade(subT,1,600);fade(th,0,600);fade(bars,0,600);fade(H,1,700);await sleep(700);th.style.display='none';res()}
  })}
/* finale */
const LETTER=["<span class=\"hl big\">There is nothing sweeter than your love.</span>", "My only craving is your heart, and no matter how much of it you give me, I still want more 🤍", "Your heart is the softest place I have ever known. On the long days, when you feel far, I hold on to the little things: your pyaari voice, your “good morning love”, that “yaarrr”, the heart you make with your hands, your fit checks, and now the bicep heart 🥵🥵🥵", "And when I get tired of missing you, I want to fight 😛", "Even our fights end the same way, with me loving you a little more than before 🫠", "Every time I see you, I fall deeper in love, and I want to explore your heart even deeper. Even though I have already won in life by having you, I still wake up every day figuring out how to make you happy.", "Because your smile is my favourite thing to earn, and I want to make you smile and laugh every single day, InshaAllah 😊", "Soon you’ll walk in, and both halves of this heart will be in the same room 🩷", "<span class=\"hl close\">Don’t let go, love.<br>You are the one for me,<br>and you are the criminal who has my heart ♥️</span>"];
async function finale(){prog(-1,6);setHint('');hint.hidden=true;H.classList.remove('beating');
  fade(kmT,0,500);fade(subT,0,500);fade($('cityL'),0,500);fade($('cityR'),0,500);
  await animD(0,600);
  document.querySelectorAll('.edge').forEach(e=>{e.style.transition='opacity 1s';e.style.opacity=.35});
  fade($('seam'),.95,250);thump(.8);buzz(40);await sleep(300);fade($('seam'),0,900);
  fade($('dimL'),0,1200);fade($('dimR'),0,1200);fade($('aura'),1,1200);
  for(let i=0;i<3;i++){H.animate([{transform:'scale(1)'},{transform:'scale(1.07)'},{transform:'scale(1)'},{transform:'scale(1.04)'},{transform:'scale(1)'}],{duration:900});H.style.transformOrigin='200px 270px';H.style.transformBox='view-box';thump(.7);await sleep(1000)}
  fade($('full'),1,2000);fade($('gL'),0,2200);fade($('gR'),0,2200);fade($('aura'),.5,2200);document.querySelectorAll('.edge').forEach(e=>{e.style.transition='opacity 1.5s';e.style.opacity=1});H.classList.add('beating');await sleep(1600);fade($('fin'),1,10);fade($('f1'),1,1000);await sleep(1200);fade($('f2'),1,1000);await sleep(1600);
  fade($('f3'),1,1000);await sleep(900);fade($('f4'),1,1000);await sleep(1200);
  const lt=$('letter');lt.innerHTML='<span class="orn" aria-hidden="true"></span>'+LETTER.map(l=>`<p>${l}</p>`).join('')+'<p class="endheart" aria-hidden="true"><svg viewBox="0 0 20 18"><path d="M10 17 C5 13 1 10 1 6 C1 3 3 1 5.5 1 C7.5 1 9 2.3 10 4 C11 2.3 12.5 1 14.5 1 C17 1 19 3 19 6 C19 10 15 13 10 17Z"/></svg></p>';lt.hidden=false;
  for(const p of lt.querySelectorAll('p')){await sleep(1500);p.classList.add('on');if(p.getBoundingClientRect().bottom>innerHeight-40)p.scrollIntoView({behavior:'smooth',block:'end'})}
  await sleep(800);$('again').hidden=false;}

async function run(){
  $('again').hidden=true;$('letter').hidden=true;hint.hidden=false;$('letter').innerHTML='';['safe','passion','dance','wanted','quiz','htarget'].forEach(i=>{const e=$(i);e.style.display='none';e.setAttribute('opacity',0);e.style.opacity=0});['verdict','bars'].forEach(i=>{const e=$(i);e.style.transition='none';e.setAttribute('opacity',0);e.style.opacity=0});$('H').style.opacity='';['gL','gR'].forEach(i=>{const e=$(i);e.style.transition='none';e.setAttribute('opacity',1);e.style.opacity=1});['fin','f1','f2','f3','f4','full','aura','seam','whisper','count'].forEach(i=>{const e=$(i);e.style.transition='none';e.setAttribute('opacity',0);e.style.opacity=0});
  ['dimL','dimR'].forEach(i=>{const e=$(i);e.style.transition='none';e.setAttribute('opacity',.25);e.style.opacity=.25});
  [kmT,subT,$('cityL'),$('cityR'),$('ghost')].forEach(e=>{e.style.transition='none';e.style.opacity=''});$('ghost').setAttribute('opacity',.35);
  document.querySelectorAll('.edge').forEach(e=>{e.style.transition='none';e.style.opacity=1});
  prog(0,0);setD(D0);words(0);
  await intro();
  const chs=[
    ['Wanted','They warned you about me. But you’re the one who stole a heart.',chWanted,125],
    ['The heist','My heart is locked away. Only our dates open it.',chSafe,100],
    ['Finish the line','Our words. Only you know them.',chQuiz,75],
    ['My passion','Draw my heart without letting go.',chPassion,50],
    ['Dance with me','You said we’ll dance together. So let’s dance.',chDance,25],
    ['Don’t let go','One finger on you, one on me.',chHold,0]];
  for(let i=0;i<chs.length;i++){const [t,sub,fn,to]=chs[i];prog(i,i);await card('Chapter '+(i+1)+' of 6',t,sub);await fn();word(i);if(to>0){await animD(to,1100)}}
  await finale();
}
$('again').onclick=()=>{stage.focus();run()};
run();
</script>
